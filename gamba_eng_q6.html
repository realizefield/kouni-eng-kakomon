/b> の設問で <b>so</b> を見つけたら、前の部分を読みましょう。</p><p><b>判断のポイント2：同じ語のひっかけに注意</b><br>④は本文の <b>phone</b> と同じ語が入っていますが、使い方が違います。<b>語が同じか</b>ではなく、<b>内容が合うか</b>で判断します。</p><p><b>覚えておきたい単語</b>：<b>beans</b>（豆）、<b>nodded</b>（うなずいた）、<b>almost every day</b>（ほとんど毎日）、<b>so</b>（だから）、<b>favorite</b>（お気に入りの）。</p>"}, {"no": 3, "qNum": 23, "paraIdx": 2, "color": "p3", "qPre": "On Sunday,", "qPost": "", "qPreJa": "日曜日、", "qPostJa": "", "choices": ["Lucas cooked alone while Sota studied.", "Sota's mother taught them how to cook.", "the boys cooked together and the family enjoyed the food.", "the family went to a restaurant."], "choicesJa": ["ソウタが勉強している間、ルーカスがひとりで料理した", "ソウタの母が二人に料理の仕方を教えた", "二人の少年が一緒に料理し、家族は食事を楽しんだ", "家族はレストランに行った"], "answer": 3, "keyWords": [{"w": "kitchen", "mean": "台所", "kana": "キッチン", "ac": "キッ"}, {"w": "dish", "mean": "料理", "kana": "ディッシュ", "ac": "ディ"}, {"w": "okonomiyaki", "mean": "お好み焼き", "kana": "オコノミヤキ", "ac": "ミヤ"}, {"w": "pancake", "mean": "パンケーキ", "kana": "パンケイク", "ac": "ケイ"}, {"w": "gestures", "mean": "身ぶり", "kana": "ジェスチャーズ", "ac": "ジェス"}, {"w": "burned", "mean": "焦げた", "kana": "バーンド", "ac": "バー"}, {"w": "asked for more", "mean": "おかわりを求めた", "kana": "アスクト フォー モア", "ac": "モア"}, {"w": "full of", "mean": "〜でいっぱい", "kana": "フル オブ", "ac": "フル"}, {"w": "restaurant", "mean": "レストラン", "kana": "レストラント", "ac": "スト"}], "hints": ["<p>第3段落「日曜日のようす」を聞く問題です。カギの単語を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>stood in the kitchen</td><td class='ja'>台所に立った</td></tr><tr><td class='en'>made okonomiyaki, a Japanese pancake</td><td class='ja'>お好み焼き（日本のパンケーキ）を作った</td></tr><tr><td class='en'>gestures</td><td class='ja'>身ぶり</td></tr><tr><td class='en'>showed him a faster way</td><td class='ja'>もっと速い方法を見せた</td></tr><tr><td class='en'>ate everything</td><td class='ja'>全部食べた</td></tr><tr><td class='en'>asked for more</td><td class='ja'>おかわりを求めた</td></tr><tr><td class='en'>full of happy voices</td><td class='ja'>楽しい声でいっぱい</td></tr></table>", "<p>「On Sunday」は第3段落の<b>最初の文</b>と同じ場面です。「誰が」「どこで」「どうなったか」を整理しましょう。</p><div class='strategy'><b>出来事を聞く問題のルール：</b><br>① 設問の<b>日時</b>（On Sunday）を本文で見つける<br>② <b>「誰が」「誰と」</b>に注目する<span class='think-arrow'>→</span>人物の組み合わせが違う選択肢は ×<br>③ <b>最後の様子</b>（その後どうなったか）も確認する</div><div class='step'><span class='signal-word'>On Sunday, the two boys stood in the kitchen</span>（日曜日、二人の少年は台所に立った）<span class='think-arrow'>→</span><b>二人</b>で<b>台所</b>にいる場面です。</div><div class='step'><span class='signal-word'>Sota's parents and sister ate everything and asked for more</span>（両親と妹は全部食べておかわりを求めた）<span class='think-arrow'>→</span>家族の<b>反応</b>がわかります。</div>", "<p>「誰が」「どこで」「どうなったか」の3つで選択肢を絞り込みましょう。</p><div class='strategy'><b>絞り込みの手順：</b><br>① 料理したのは<b>二人</b>（ひとりではない）<br>② 場所は<b>家の台所</b>（外ではない）<br>③ 家族は<b>喜んで食べた</b></div><div class='step'>「ルーカスがひとりで」は<b>人数</b>が違います。「母が教えた」は<b>人物</b>が違います。「レストランに行った」は<b>場所</b>が違います。</div><div class='step'>残るのは、<b>二人で料理したこと</b>と<b>家族の反応</b>の両方を述べている選択肢です。</div>"], "explain": "<p>第3段落「日曜日のようす」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：③ the boys cooked together and the family enjoyed the food</div><div class=\"clue-quote\">On Sunday, the two boys stood in the kitchen. Lucas made a Brazilian dish with rice and beans, and Sota made okonomiyaki, a Japanese pancake.</div><div class=\"clue-quote\">Sota's parents and sister ate everything and asked for more.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">the two boys stood in the kitchen</span>（二人の少年が台所に立った）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">the boys cooked together</span>（二人が一緒に料理した）</b>、<b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">ate everything and asked for more</span>（全部食べておかわりを求めた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">enjoyed the food</span>（食事を楽しんだ）</b>。具体的な行動が、選択肢では「一緒に料理した」「楽しんだ」とまとめて言い換えられています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① ルーカスがひとりで料理</td><td>二人で台所に立ち、それぞれ料理した。ソウタが勉強していたとも書かれていない</td><td class=\"ng\">×</td></tr><tr><td>② 母が料理を教えた</td><td>母が教えたとは書かれていない。むしろルーカスがソウタに速い切り方を見せた</td><td class=\"ng\">×</td></tr><tr><td>③ 二人で料理し、家族は楽しんだ</td><td>「the two boys」「ate everything and asked for more」と一致</td><td class=\"ok\">○</td></tr><tr><td>④ レストランに行った</td><td>レストランの記述はなく、料理は家の台所で作った</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：人物の組み合わせを確認する</b><br>「誰が」「誰に教えた」のような<b>人物の関係</b>は、ひっかけになりやすい部分です。②の<b>母</b>は第2段落でカレーを作った人で、第3段落では料理していません。</p><p><b>判断のポイント2：具体例をまとめる言い換えを見抜く</b><br>本文の<b>ate everything and asked for more</b>（全部食べておかわり）は、選択肢では<b>enjoyed</b>（楽しんだ）と<b>抽象的に</b>言い換えられています。具体的な描写が、気持ちを表す語に変わるパターンです。</p><p><b>覚えておきたい単語</b>：<b>kitchen</b>（台所）、<b>gestures</b>（身ぶり）、<b>burned</b>（焦げた）、<b>ask for more</b>（おかわりを求める）、<b>be full of 〜</b>（〜でいっぱい）。</p>"}, {"no": 4, "qNum": 24, "paraIdx": 3, "color": "p4", "qPre": "Through this experience, Sota learned that", "qPost": "", "qPreJa": "この経験を通して、ソウタが学んだのは、", "qPostJa": "", "choices": ["speaking perfect English is the most important thing.", "the wish to understand each other is important.", "it is better to stay quiet with a guest.", "cooking is too difficult for foreign students."], "choicesJa": ["完璧な英語を話すことがいちばん大切だということ", "おたがいを理解したいという気持ちが大切だということ", "客人とは静かにしているほうがよいということ", "料理は外国人留学生には難しすぎるということ"], "answer": 2, "keyWords": [{"w": "afraid", "mean": "怖がって", "kana": "アフレイド", "ac": "レイ"}, {"w": "mistakes", "mean": "間違い", "kana": "ミステイクス", "ac": "ステイ"}, {"w": "hugged", "mean": "抱きしめた", "kana": "ハグド", "ac": "ハ"}, {"w": "realized", "mean": "気づいた", "kana": "リーアライズド", "ac": "ライズ"}, {"w": "connect with", "mean": "〜とつながる", "kana": "コネクト ウィズ", "ac": "ネク"}, {"w": "even if", "mean": "たとえ〜でも", "kana": "イーヴン イフ", "ac": "イフ"}, {"w": "perfectly", "mean": "完全に", "kana": "パーフェクトリ", "ac": "パー"}, {"w": "matters", "mean": "重要である", "kana": "マタズ", "ac": "マ"}, {"w": "wish", "mean": "願い・気持ち", "kana": "ウィッシュ", "ac": "ウィ"}, {"w": "each other", "mean": "おたがい", "kana": "イーチ アザー", "ac": "イー"}], "hints": ["<p>第4段落「最後に学んだこと」を聞く問題です。カギの単語を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>realized that</td><td class='ja'>〜ということに気づいた</td></tr><tr><td class='en'>connect with people</td><td class='ja'>人とつながる</td></tr><tr><td class='en'>even if</td><td class='ja'>たとえ〜でも</td></tr><tr><td class='en'>the same language perfectly</td><td class='ja'>同じ言葉を完全に</td></tr><tr><td class='en'>What matters most</td><td class='ja'>いちばん大切なこと</td></tr><tr><td class='en'>wish</td><td class='ja'>願い・気持ち</td></tr><tr><td class='en'>understand each other</td><td class='ja'>おたがいを理解する</td></tr></table>", "<p>「学んだこと」「気づいたこと」は<b>最終段落</b>に書かれていることが多いです。</p><div class='strategy'><b>教訓を探すルール：</b><br>① <b>realized / learned / taught</b> などの合図の語を探す<span class='think-arrow'>→</span>その後ろが教訓<br>② <b>matters most</b>（いちばん大切）のような強調表現にも注目<br>③ 本文と<b>同じ意味</b>の言い換えを選択肢から探す</div><div class='step'><span class='signal-word'>Sota realized that you can connect with people even if you do not speak the same language perfectly</span>（同じ言葉を完全に話せなくても人とつながれると気づいた）<span class='think-arrow'>→</span><b>完璧さ</b>は条件ではありません。</div><div class='step'>最後の文 <span class='signal-word'>What matters most is the wish to understand each other</span>（いちばん大切なのは、おたがいを理解したいという気持ち）<span class='think-arrow'>→</span>これが結論です。</div>", "<p>最後の2文で見つけた結論と合わない選択肢を外しましょう。</p><div class='strategy'><b>絞り込みの手順：</b><br>① 結論は<b>「完璧な言葉」ではなく「気持ち」</b><br>② 本文の<b>流れと反対</b>の内容は ×<br>③ 物語全体の<b>雰囲気</b>（沈黙は気まずい、料理は楽しい）とも照らす</div><div class='step'>「完璧な英語が最重要」は <b>even if ... perfectly</b>（完全でなくても）と<b>逆</b>です。「静かにするのがよい」は、沈黙が<b>気まずかった</b>ことと合いません。「料理は難しすぎる」は、料理が<b>楽しい時間</b>だったことと合いません。</div><div class='step'>残るのは、<b>気持ち</b>について、<b>What matters most</b> と同じ内容を述べている選択肢です。</div>"], "explain": "<p>第4段落「ソウタが学んだこと」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：② the wish to understand each other is important</div><div class=\"clue-quote\">Sota realized that you can connect with people even if you do not speak the same language perfectly. What matters most is the wish to understand each other.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">What matters most is the wish to understand each other</span>（いちばん大切なのは、おたがいを理解したいという気持ち）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">the wish to understand each other is important</span>（おたがいを理解したい気持ちが大切）</b>。<b>matters most</b>（いちばん重要）を <b>important</b>（大切）に言い換えています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 完璧な英語が最も大切</td><td>本文は「even if you do not speak ... perfectly」（完璧でなくても）。逆の内容</td><td class=\"ng\">×</td></tr><tr><td>② 理解したい気持ちが大切</td><td>「What matters most is the wish to understand each other」と一致</td><td class=\"ok\">○</td></tr><tr><td>③ 客人とは静かにするのがよい</td><td>沈黙は「made Sota feel uncomfortable」で、むしろ気まずいものだった</td><td class=\"ng\">×</td></tr><tr><td>④ 料理は難しすぎる</td><td>二人は料理を楽しみ、家族も喜んだ。難しすぎるという記述はない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：「realized」「matters most」は結論のサイン</b><br>物語文の最終段落では、<b>realized</b>（気づいた）や <b>matters most</b>（いちばん大切）の後ろに教訓が書かれます。設問が「learned that」なら、まずここを探しましょう。</p><p><b>判断のポイント2：「even if」は逆転の目印</b><br><b>even if 〜</b>（たとえ〜でも）は、「完璧でなくてもよい」という意味を作ります。そのため①の「完璧な英語が最も大切」は本文と正反対です。<b>反対の内容</b>に気づくことが大切です。</p><p><b>覚えておきたい単語</b>：<b>realize</b>（気づく）、<b>connect with 〜</b>（〜とつながる）、<b>perfectly</b>（完全に）、<b>matter</b>（重要である）、<b>wish</b>（願い・気持ち）。</p>"}]}, "Set-C": {"storyTitle": "Aya and the Order Note", "topicJa": "アルバイト：注文ミスを正直に謝り、店主に助けられて成長する話", "paragraphs": [{"summary": "Ayaがパン屋で働き始める", "en": "Aya was nineteen years old. She had stayed home from school for two years, and she wanted to try something new. So she started a part-time job at a small bakery near her house. Her job was to put bread in bags and take orders at the counter. She chose this shop because the owner, Mr. Kato, had been kind to her when she visited as a customer. In her first week, she was happy but a little nervous.", "ja": "Ayaは19歳。2年間学校に行かず家にいたが、何か新しいことに挑戦したくて、家の近くの小さなパン屋でアルバイトを始めた。仕事はパンを袋に入れることと、カウンターで注文を受けること。店主のカトウさんが客として来た時に親切だったのでこの店を選んだ。最初の週は、うれしい気持ちと少しの緊張があった。"}, {"summary": "注文ミスを正直に謝る", "en": "One Saturday, a woman ordered ten sandwiches for a birthday party. She wanted to pick them up at three o'clock. The shop was very busy, and Aya wrote \"five o'clock\" on the order note by mistake. At three, the woman came back, but the sandwiches were not ready. She looked very disappointed. Aya's face turned pale. She wanted to run to the back room, but she took a deep breath and said, \"I'm so sorry. It was my mistake.\"", "ja": "ある土曜日、女性が誕生日会のためにサンドイッチを10個注文した。3時に取りに来る予定だった。店はとても忙しく、Ayaは注文メモに間違って「5時」と書いてしまった。3時に女性が戻ってきたが、サンドイッチはできていなかった。女性はとてもがっかりした。Ayaは青ざめ、奥の部屋に逃げたかったが、深呼吸をして「申し訳ありません。私のミスです」と言った。"}, {"summary": "店主と一緒に作り直す", "en": "Mr. Kato heard her and came out of the kitchen. He did not shout. He said, \"Thank you for telling the truth. Let's fix this together.\" He and Aya started making the sandwiches right away. Thirty minutes later, they were done. The woman said, \"Thank you for working so hard. I will order again.\" Aya bowed deeply, and her eyes became wet.", "ja": "カトウさんはAyaの声を聞いて、厨房から出てきた。怒鳴らず、「本当のことを言ってくれてありがとう。一緒に直そう」と言った。二人はすぐにサンドイッチ作りを始め、30分後に完成した。女性は「一生懸命働いてくれてありがとう。また注文します」と言った。Ayaは深くおじぎをし、目がうるんだ。"}, {"summary": "失敗の後の行動を学ぶ", "en": "After the shop closed, Mr. Kato said to Aya, \"I made many mistakes when I was young, too. Everyone makes them. What matters is what you do next.\" Aya felt relieved. The next day, she began to use a checklist and to read every order twice. She learned that telling the truth takes courage, but it can also help people trust you.", "ja": "店が閉まった後、カトウさんはAyaに「私も若い頃はたくさん失敗した。誰でも失敗する。大切なのは、その後に何をするかだ」と言った。Ayaはほっとした。翌日から、チェックリストを使い、注文を2回読むようにした。Ayaは、本当のことを伝えるには勇気がいるが、それが人から信頼されることにもつながると学んだ。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "Aya chose to work at the bakery because", "qPost": "", "qPreJa": "Ayaがパン屋で働くことを選んだのは、", "qPostJa": "", "choices": ["she wanted to learn how to bake", "she needed money for school", "the owner had been kind to her", "her friend worked there"], "choicesJa": ["パンの焼き方を学びたかった", "学校のためにお金が必要だった", "店主が彼女に親切にしてくれていた", "友達がそこで働いていた"], "answer": 3, "keyWords": [{"w": "part-time", "mean": "アルバイトの", "kana": "パートタイム", "ac": "タイ"}, {"w": "bakery", "mean": "パン屋", "kana": "ベイカリー", "ac": "ベイ"}, {"w": "chose", "mean": "選んだ", "kana": "チョウズ", "ac": "チョ"}, {"w": "owner", "mean": "店主", "kana": "オウナー", "ac": "オウ"}, {"w": "customer", "mean": "客", "kana": "カスタマー", "ac": "カス"}, {"w": "nervous", "mean": "緊張した", "kana": "ナーバス", "ac": "ナー"}, {"w": "take orders", "mean": "注文を受ける", "kana": "テイクオーダーズ", "ac": "オー"}, {"w": "bake", "mean": "パンを焼く", "kana": "ベイク", "ac": "ベイ"}], "hints": ["<p>この設問は<b>第1段落</b>の問題です。「選んだ理由」を聞いているので、カギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>chose this shop</td><td class='ja'>この店を選んだ</td></tr><tr><td class='en'>because</td><td class='ja'>なぜなら（理由を表す）</td></tr><tr><td class='en'>owner</td><td class='ja'>店主</td></tr><tr><td class='en'>visited as a customer</td><td class='ja'>客として訪れた</td></tr><tr><td class='en'>take orders at the counter</td><td class='ja'>カウンターで注文を受ける</td></tr><tr><td class='en'>a little nervous</td><td class='ja'>少し緊張した</td></tr></table>", "<p>「なぜ〜したのか」を聞く問題は、<b>理由を表す語</b>を探すのが基本です。</p><div class='strategy'><b>理由を聞く問題のルール：</b><br>① 設問の動詞（chose）を本文で探す<span class='think-arrow'>→</span>同じ文に答えがあることが多い<br>② <b>because</b> を見つける<span class='think-arrow'>→</span>その後ろが理由<br>③ 選択肢が本文に<b>書いてあるか</b>を確認する</div><div class='step'>第1段落 <span class='signal-word'>She chose this shop because ...</span>（この店を選んだのは〜だから）<span class='think-arrow'>→</span>because の後ろを読みましょう。</div><div class='step'>後ろには<span class='signal-word'>the owner, Mr. Kato</span>（店主のカトウさん）についての説明があります。<span class='think-arrow'>→</span>店主が<b>客として来た時</b>にどうだったかがポイントです。</div>", "<p>選択肢を絞りこみましょう。</p><p>本文でAyaの仕事は<b>パンを袋に入れる</b>ことと<b>注文を受ける</b>ことでした。「パンを焼く」ことは仕事に入っていません。また、<b>お金</b>や<b>友達</b>の話は第1段落のどこにも出てきません。</p><p>残るのは「<b>店主</b>の<b>過去の態度</b>」について書かれた選択肢です。本文の <b>had been kind</b> を言い換えた形を探しましょう。</p>"], "explain": "<p>第1段落から「理由」を探す問題です。</p><div class=\"ans-key\">✅ 正解：③ the owner had been kind to her</div><div class=\"clue-quote\">She chose this shop because the owner, Mr. Kato, had been kind to her when she visited as a customer.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">the owner, Mr. Kato, had been kind to her</span>（店主のカトウさんが彼女に親切にしてくれていた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">the owner had been kind to her</span>（店主が彼女に親切にしてくれていた）</b>。本文の <b>because</b> の後ろが理由で、選択肢はほぼ同じ内容を、名前を省いて短くまとめています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① パンの焼き方を学びたい</td><td>Ayaの仕事は袋詰めと注文受けで、パンを焼く仕事ではない</td><td class=\"ng\">×</td></tr><tr><td>② 学校のためにお金が必要</td><td>お金や学費の話は本文にない</td><td class=\"ng\">×</td></tr><tr><td>③ 店主が親切にしてくれていた</td><td>「because the owner ... had been kind to her」と一致</td><td class=\"ok\">○</td></tr><tr><td>④ 友達が働いていた</td><td>友達の話は本文にない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：because の後ろが理由</b><br><b>because</b> は「なぜなら」という意味で、<b>その後ろに理由</b>が来ます。「選んだ理由」を聞かれたら、まず because を探しましょう。</p><p><b>判断のポイント2：本文にない内容は選ばない</b><br>②のお金、④の友達は、いかにもありそうな理由ですが、<b>本文に書かれていない</b>ので×です。自分の想像ではなく、本文に書いてあることだけで判断しましょう。</p><p><b>覚えておきたい単語</b>：<b>owner</b>（店主）、<b>customer</b>（客）、<b>because</b>（なぜなら）、<b>nervous</b>（緊張した）。</p>"}, {"no": 2, "qNum": 22, "paraIdx": 1, "color": "p2", "qPre": "The customer was disappointed because", "qPost": "", "qPreJa": "その客ががっかりしたのは、", "qPostJa": "", "choices": ["the sandwiches were too expensive", "Aya forgot to take the order", "the shop had no bread", "Aya had written the wrong time on the note"], "choicesJa": ["サンドイッチが高すぎた", "Ayaが注文を受けるのを忘れた", "店にパンがなかった", "Ayaが注文メモに間違った時間を書いていた"], "answer": 4, "keyWords": [{"w": "disappointed", "mean": "がっかりした", "kana": "ディサポインティド", "ac": "ポイン"}, {"w": "ordered", "mean": "注文した", "kana": "オーダード", "ac": "オー"}, {"w": "deep breath", "mean": "深呼吸", "kana": "ディープブレス", "ac": "ブレ"}, {"w": "busy", "mean": "忙しい", "kana": "ビジー", "ac": "ビ"}, {"w": "by mistake", "mean": "間違って", "kana": "バイミステイク", "ac": "ステイ"}, {"w": "ready", "mean": "準備ができた", "kana": "レディ", "ac": "レ"}, {"w": "pale", "mean": "青ざめた", "kana": "ペイル", "ac": "ペイ"}, {"w": "note", "mean": "メモ", "kana": "ノウト", "ac": "ノウ"}, {"w": "expensive", "mean": "高価な", "kana": "イクスペンシヴ", "ac": "ペン"}], "hints": ["<p>この設問は<b>第2段落</b>の問題です。客が「なぜがっかりしたか」を考えるために、語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>pick them up at three o'clock</td><td class='ja'>3時に取りに行く</td></tr><tr><td class='en'>very busy</td><td class='ja'>とても忙しい</td></tr><tr><td class='en'>order note</td><td class='ja'>注文メモ</td></tr><tr><td class='en'>by mistake</td><td class='ja'>間違って</td></tr><tr><td class='en'>were not ready</td><td class='ja'>できていなかった</td></tr><tr><td class='en'>looked very disappointed</td><td class='ja'>とてもがっかりした様子だった</td></tr></table>", "<p>「がっかりした理由」は、<b>期待と現実がズレた場面</b>にあります。</p><div class='strategy'><b>原因を探すルール：</b><br>① 感情の語（disappointed）を本文で見つける<span class='think-arrow'>→</span>その<b>直前</b>に原因がある<br>② <b>but</b> に注目<span class='think-arrow'>→</span>「期待と違う結果」を示す<br>③ 原因の<b>もと</b>になった出来事を、さらにさかのぼる</div><div class='step'><span class='signal-word'>At three, the woman came back, but the sandwiches were not ready.</span>（3時に女性が戻ってきたが、サンドイッチはできていなかった）<span class='think-arrow'>→</span>がっかりの直接の理由は「できていなかった」こと。</div><div class='step'>では、なぜできていなかったのでしょうか。1つ前の文 <span class='signal-word'>Aya wrote ... on the order note by mistake</span> に注目しましょう。<span class='think-arrow'>→</span>メモに何かを<b>間違えて</b>書いたようです。</div>", "<p>選択肢を絞りこみましょう。</p><p>本文には、サンドイッチの<b>値段</b>の話も、店に<b>パンがない</b>という話も出てきません。この2つは外れます。</p><p>また、Ayaは注文を<b>受けて</b>メモを書いています。「注文を受け忘れた」のではありません。正解は、<b>メモに書いた内容</b>が正しくなかったことを述べた選択肢です。メモに書いたのが何だったか（時間・数・名前）を本文で確認しましょう。</p>"], "explain": "<p>第2段落「客ががっかりした原因」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：④ Aya had written the wrong time on the note</div><div class=\"clue-quote\">The shop was very busy, and Aya wrote \"five o'clock\" on the order note by mistake. At three, the woman came back, but the sandwiches were not ready.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">Aya wrote \"five o'clock\" on the order note by mistake</span>（注文メモに間違って5時と書いた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">Aya had written the wrong time on the note</span>（メモに間違った時間を書いていた）</b>。<b>by mistake</b>（間違って）が <b>wrong</b>（間違った）に、<b>five o'clock</b> が <b>time</b>（時間）に言い換えられています。客は3時に来たのに、メモは5時になっていたので、サンドイッチができていなかったのです。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① サンドイッチが高すぎた</td><td>値段の話は本文にない</td><td class=\"ng\">×</td></tr><tr><td>② 注文を受け忘れた</td><td>注文は受けている。間違えたのはメモの時間</td><td class=\"ng\">×</td></tr><tr><td>③ 店にパンがなかった</td><td>パンがないという記述は本文にない</td><td class=\"ng\">×</td></tr><tr><td>④ メモに間違った時間を書いた</td><td>「wrote five o'clock ... by mistake」と一致</td><td class=\"ok\">○</td></tr></table><p><b>判断のポイント1：具体例が一般的な言葉に言い換えられる</b><br>本文の <b>\"five o'clock\"</b> という具体的な時刻が、選択肢では <b>the wrong time</b>（間違った時間）にまとめられています。具体的な表現が総称に変わるのは、言い換えの典型パターンです。</p><p><b>判断のポイント2：order という語のひっかけ</b><br>②は本文の <b>order</b> という語を使ったひっかけです。Ayaは注文を受けてメモを書いたので、「忘れた」わけではありません。同じ単語があっても、内容が合っているか必ず確認しましょう。</p><p><b>覚えておきたい単語</b>：<b>disappointed</b>（がっかりした）、<b>by mistake</b>（間違って）、<b>pick up</b>（受け取る）、<b>ready</b>（準備ができた）。</p>"}, {"no": 3, "qNum": 23, "paraIdx": 2, "color": "p3", "qPre": "After Aya told the truth, Mr. Kato", "qPost": "", "qPreJa": "Ayaが本当のことを話した後、カトウさんは、", "qPostJa": "", "choices": ["helped her make the sandwiches", "told her to go home", "lowered her pay", "asked another worker to fix it"], "choicesJa": ["彼女がサンドイッチを作るのを手伝った", "彼女に家に帰るように言った", "彼女の給料を下げた", "ほかの従業員にそれを直すよう頼んだ"], "answer": 1, "keyWords": [{"w": "shout", "mean": "どなる", "kana": "シャウト", "ac": "シャウ"}, {"w": "truth", "mean": "真実", "kana": "トゥルース", "ac": "トゥル"}, {"w": "fix", "mean": "直す", "kana": "フィックス", "ac": "フィッ"}, {"w": "right away", "mean": "すぐに", "kana": "ライトアウェイ", "ac": "ライ"}, {"w": "kitchen", "mean": "厨房", "kana": "キッチン", "ac": "キッ"}, {"w": "together", "mean": "一緒に", "kana": "トゥゲザー", "ac": "ゲ"}, {"w": "helped", "mean": "手伝った", "kana": "ヘルプト", "ac": "ヘル"}, {"w": "lowered", "mean": "下げた", "kana": "ロウアード", "ac": "ロウ"}, {"w": "worker", "mean": "従業員", "kana": "ワーカー", "ac": "ワー"}], "hints": ["<p>この設問は<b>第3段落</b>の問題です。店主が「何をしたか」を聞いているので、行動を表す語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>came out of the kitchen</td><td class='ja'>厨房から出てきた</td></tr><tr><td class='en'>did not shout</td><td class='ja'>怒鳴らなかった</td></tr><tr><td class='en'>Thank you for telling the truth</td><td class='ja'>本当のことを言ってくれてありがとう</td></tr><tr><td class='en'>Let's fix this together</td><td class='ja'>一緒に直そう</td></tr><tr><td class='en'>started making</td><td class='ja'>作り始めた</td></tr><tr><td class='en'>right away</td><td class='ja'>すぐに</td></tr></table>", "<p>「〜の後、何をしたか」は、<b>動詞</b>に注目して本文を順番に読みます。</p><div class='strategy'><b>行動を聞く問題のルール：</b><br>① 設問の「〜した後」の場面を本文で見つける<span class='think-arrow'>→</span>その<b>次の文</b>から読む<br>② <b>誰が</b>、<b>何を</b>したかを動詞で確認する<br>③ 本文に出てこない行動は選ばない</div><div class='step'>店主は <span class='signal-word'>He did not shout.</span>（怒鳴らなかった）<span class='think-arrow'>→</span>責める行動ではなさそうです。</div><div class='step'>続く <span class='signal-word'>Let's fix this together.</span>（一緒に直そう）のあと、実際に何を始めたかを次の文で確認しましょう。<span class='think-arrow'>→</span><b>誰と</b>、<b>何を</b>始めたかがポイントです。</div>", "<p>選択肢を絞りこみましょう。</p><p>店主は <b>He did not shout.</b> とあり、Ayaを叱ったり罰したりしていません。「家に帰れと言った」「給料を下げた」はどちらも本文にない<b>厳しい対応</b>なので外れます。</p><p>また、作業をしたのは店主と<b>Aya本人</b>で、ほかの従業員は登場しません。正解は、店主がAyaと<b>一緒に</b>作業したことを表す選択肢です。本文の <b>started making</b> を言い換えた動詞を探しましょう。</p>"], "explain": "<p>第3段落「店主の行動」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：① helped her make the sandwiches</div><div class=\"clue-quote\">He said, \"Thank you for telling the truth. Let's fix this together.\" He and Aya started making the sandwiches right away.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">He and Aya started making the sandwiches</span>（彼とAyaがサンドイッチを作り始めた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">helped her make the sandwiches</span>（彼女がサンドイッチを作るのを手伝った）</b>。「二人で一緒に作る」ことを、店主の側から見て「手伝った」と言い換えています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 作るのを手伝った</td><td>「He and Aya started making the sandwiches」と一致</td><td class=\"ok\">○</td></tr><tr><td>② 家に帰るように言った</td><td>帰れという記述はない。He did not shout. とある</td><td class=\"ng\">×</td></tr><tr><td>③ 給料を下げた</td><td>給料の話は本文にない</td><td class=\"ng\">×</td></tr><tr><td>④ ほかの従業員に頼んだ</td><td>店主とAyaの二人で作っている。ほかの従業員は出てこない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：「一緒に」を「手伝う」と言い換える</b><br>本文は「He and Aya」（彼とAya）の二人が主語です。これを店主の立場から見ると「Ayaを手伝った」になります。主語を変えて同じ内容を表すのも、言い換えの典型です。</p><p><b>判断のポイント2：本文のトーンに合わない選択肢は外す</b><br>この段落の店主は <b>Thank you</b> や <b>Let's fix this together</b> と、やさしく前向きです。「帰れ」「給料を下げる」は、このトーンと合いません。</p><p><b>覚えておきたい単語</b>：<b>shout</b>（どなる）、<b>truth</b>（真実）、<b>fix</b>（直す）、<b>right away</b>（すぐに）。</p>"}, {"no": 4, "qNum": 24, "paraIdx": 3, "color": "p4", "qPre": "Through this experience, Aya learned that", "qPost": "", "qPreJa": "この経験を通して、Ayaが学んだのは、", "qPostJa": "", "choices": ["it is best to hide mistakes", "what you do after a mistake matters", "working fast is more important than being careful", "part-time workers never make mistakes"], "choicesJa": ["失敗は隠すのが一番だ", "失敗した後に何をするかが大切だ", "速く働くことは注意深さより大切だ", "アルバイトの人は決して失敗しない"], "answer": 2, "keyWords": [{"w": "mistakes", "mean": "失敗", "kana": "ミステイクス", "ac": "ステイ"}, {"w": "matters", "mean": "大切である", "kana": "マターズ", "ac": "マ"}, {"w": "relieved", "mean": "ほっとした", "kana": "リリーヴド", "ac": "リリー"}, {"w": "checklist", "mean": "確認表", "kana": "チェックリスト", "ac": "チェッ"}, {"w": "twice", "mean": "2回", "kana": "トゥワイス", "ac": "ワイ"}, {"w": "courage", "mean": "勇気", "kana": "カレッジ", "ac": "レ"}, {"w": "trust", "mean": "信頼する", "kana": "トラスト", "ac": "トラ"}, {"w": "careful", "mean": "注意深い", "kana": "ケアフル", "ac": "ケア"}, {"w": "hide", "mean": "隠す", "kana": "ハイド", "ac": "ハイ"}, {"w": "learned", "mean": "学んだ", "kana": "ラーンド", "ac": "ラー"}], "hints": ["<p>この設問は<b>第4段落</b>の問題です。「学んだこと」を聞いているので、店主の言葉とAyaの変化に関する語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>made many mistakes</td><td class='ja'>たくさん失敗した</td></tr><tr><td class='en'>Everyone makes them.</td><td class='ja'>誰でも失敗する</td></tr><tr><td class='en'>What matters is ...</td><td class='ja'>大切なのは〜だ</td></tr><tr><td class='en'>what you do next</td><td class='ja'>次に何をするか</td></tr><tr><td class='en'>felt relieved</td><td class='ja'>ほっとした</td></tr><tr><td class='en'>learned that ...</td><td class='ja'>〜ということを学んだ</td></tr></table>", "<p>「学んだこと」「教訓」を聞く問題は、<b>最終段落</b>の言葉がカギです。</p><div class='strategy'><b>教訓を探すルール：</b><br>① <b>learned</b>、<b>taught</b>、<b>realized</b> などの語を探す<span class='think-arrow'>→</span>教訓のサイン<br>② 登場人物が<b>強調して言った言葉</b>に注目する<br>③ その後の<b>行動の変化</b>も教訓を裏づける</div><div class='step'>店主の言葉 <span class='signal-word'>What matters is what you do next.</span>（大切なのは次に何をするかだ）<span class='think-arrow'>→</span>失敗そのものではなく、<b>失敗の後</b>が大切という考えです。</div><div class='step'>Ayaは翌日から <span class='signal-word'>use a checklist ... read every order twice</span>（チェックリストを使い、注文を2回読む）ようになりました。<span class='think-arrow'>→</span>失敗の<b>後の行動</b>を変えたということです。</div>", "<p>選択肢を絞りこみましょう。</p><p>Ayaは逃げずに<b>正直に話し</b>、それで信頼につながりました。「失敗を<b>隠す</b>」はこの流れと正反対です。また、Ayaは<b>2回読む</b>ようになったので、「速さのほうが大切」とも合いません。</p><p>店主は <b>Everyone makes them.</b>（誰でも失敗する）と言っているので、「失敗しない」という内容も外れます。正解は、<b>失敗の後</b>の行動に価値を置いた選択肢です。</p>"], "explain": "<p>第4段落「Ayaが学んだこと」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：② what you do after a mistake matters</div><div class=\"clue-quote\">Everyone makes them. What matters is what you do next.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">What matters is what you do next</span>（大切なのは、次に何をするかだ）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">what you do after a mistake matters</span>（失敗した後に何をするかが大切だ）</b>。本文の <b>next</b>（次に）が、選択肢では <b>after a mistake</b>（失敗の後に）と具体的に言い換えられ、<b>What matters is ...</b> が <b>... matters</b> と語順を変えて表されています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 失敗は隠すのが一番</td><td>隠さず正直に話して信頼につながった。逆の内容</td><td class=\"ng\">×</td></tr><tr><td>② 失敗の後の行動が大切</td><td>「What matters is what you do next」と一致</td><td class=\"ok\">○</td></tr><tr><td>③ 速さのほうが大切</td><td>Ayaは注文を2回読むようになり、慎重さを選んだ</td><td class=\"ng\">×</td></tr><tr><td>④ アルバイトは失敗しない</td><td>「Everyone makes them」（誰でも失敗する）と矛盾</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：登場人物の「強調した言葉」は教訓になる</b><br><b>What matters is ...</b> は「大切なのは〜だ」という強調の形です。こうした表現のあとに、物語の<b>教訓</b>が書かれていることがよくあります。</p><p><b>判断のポイント2：Ayaの行動の変化も根拠になる</b><br>Ayaは翌日から <b>checklist</b> を使い、注文を <b>twice</b> 読むようになりました。失敗の後の行動を変えたことが、正解を裏づけています。</p><p><b>覚えておきたい単語</b>：<b>matter</b>（大切である）、<b>relieved</b>（ほっとした）、<b>courage</b>（勇気）、<b>trust</b>（信頼する）。</p>"}]}, "Set-D": {"storyTitle": "Momo Comes Out", "topicJa": "動物：保護犬に根気よく接して信頼を得るボランティアの話", "paragraphs": [{"summary": "犬のモモが人を怖がる", "en": "Kenta, a high school student, worked as a volunteer at an animal shelter every Sunday. His job was to walk the dogs and clean their rooms. One small brown dog named Momo always hid in the corner whenever people came near. A staff member told him that Momo had been left alone in a park, so she was afraid of people. Some volunteers said, \"She will never trust anyone.\"", "ja": "高校生のケンタは、毎週日曜日に動物保護施設でボランティアとして働いていた。彼の仕事は犬を散歩させ、犬の部屋を掃除することだった。モモという名前の小さな茶色い犬は、人が近づくといつも部屋の隅に隠れた。職員の一人が、モモは公園に置き去りにされたので人を怖がっているのだと彼に教えた。ボランティアの中には「あの子は決して誰も信じないよ」と言う人もいた。"}, {"summary": "静かに待つケンタ", "en": "Kenta felt sorry for Momo. He did not try to pull her out of her room. Instead, he decided to sit quietly near her room for ten minutes every week and read a book. At first, Momo only watched him from the corner. After three weeks, she moved a few steps closer. A month later, she took a small treat from his hand. Kenta was so happy that he ran to tell the staff.", "ja": "ケンタはモモをかわいそうに思った。彼はモモを部屋から引っ張り出そうとはしなかった。そうではなく、毎週10分間、モモの部屋の近くに静かに座って本を読むことにした。最初、モモは隅から彼を見ているだけだった。3週間後、モモは数歩近づいてきた。1か月後には、彼の手から小さなおやつを受け取った。ケンタはとてもうれしくて、走って職員に知らせに行った。"}, {"summary": "家族の前で出てくるモモ", "en": "Ms. Mori, the head of the shelter, smiled and said, \"You gave her time, Kenta. That was the right thing to do.\" Soon after that, a family came to the shelter to look for a dog. Momo hid at first. But when Kenta sat down by the door, she came out slowly and sat at his feet. The little girl in the family said softly, \"She is so gentle.\" The family decided to take Momo home.", "ja": "施設長のモリさんはほほえんで言った。「あなたは彼女に時間をあげたのね、ケンタ。それは正しいことだったわ。」その後まもなく、一組の家族が犬を探しに施設へやって来た。モモは最初は隠れた。しかしケンタがドアのそばに座ると、モモはゆっくりと出てきて、彼の足元に座った。その家族の小さな女の子が「この子はとてもやさしいのね」とそっと言った。家族はモモを家に迎えることにした。"}, {"summary": "信頼は待って育つと学ぶ", "en": "On the day Momo left, Kenta felt happy and a little sad at the same time. A week later, the girl sent him a photo of Momo running in a garden. Kenta looked at it for a long time. He learned that trust cannot be forced. It grows when you wait and care. Now he is thinking about studying to work with animals in the future.", "ja": "モモが去る日、ケンタはうれしくもあり、少し寂しくもあった。1週間後、その女の子がモモが庭を走っている写真を送ってくれた。ケンタはそれを長い間見つめた。彼は、信頼は無理に作れないことを学んだ。信頼は、待ち、世話をすることで育つのだ。今、彼は将来動物に関わる仕事をするために勉強することを考えている。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "Momo was afraid of people because", "qPost": "", "qPreJa": "モモが人を怖がったのは、", "qPostJa": "", "keyWords": [{"w": "volunteer", "mean": "ボランティア", "kana": "ヴァランティア", "ac": "ティア"}, {"w": "shelter", "mean": "保護施設", "kana": "シェルター", "ac": "シェル"}, {"w": "corner", "mean": "隅", "kana": "コーナー", "ac": "コー"}, {"w": "whenever", "mean": "〜するときはいつも", "kana": "ウェンエヴァー", "ac": "エヴァ"}, {"w": "staff", "mean": "職員", "kana": "スタッフ", "ac": "スタ"}, {"w": "afraid", "mean": "怖がって", "kana": "アフレイド", "ac": "レイ"}, {"w": "trust", "mean": "信頼する", "kana": "トラスト", "ac": "トラ"}, {"w": "hid", "mean": "隠れた(hideの過去形)", "kana": "ヒッド", "ac": "ヒ"}, {"w": "alone", "mean": "ひとりで", "kana": "アロウン", "ac": "ロウ"}], "hints": ["<p>第1段落に、理由を説明している文があります。まず本文のカギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>afraid of people</td><td class='ja'>人を怖がる</td></tr><tr><td class='en'>hid in the corner</td><td class='ja'>隅に隠れた</td></tr><tr><td class='en'>whenever people came near</td><td class='ja'>人が近づくといつも</td></tr><tr><td class='en'>a staff member</td><td class='ja'>職員の一人</td></tr><tr><td class='en'>told him that ...</td><td class='ja'>彼に…と教えた</td></tr><tr><td class='en'>so</td><td class='ja'>だから</td></tr></table>", "<p>「〜のは…からだ」という<b>理由</b>を探す問題です。理由と結果をつなぐ語に注目しましょう。</p><div class='strategy'><b>理由を探すルール：</b><br>① 設問の結果（afraid of people）を本文で探す<br>② その前後にある<b>つなぎの語</b>（so, because など）を見る<br>③ <b>原因は結果の前</b>か後か、語によって決まる</div><div class='step'>本文には <span class='signal-word'>so she was afraid of people</span> とあります。<span class='think-arrow'>→</span><b>so</b> は「だから」で、<b>so の前が原因、後ろが結果</b>です。理由は <b>so の前</b>にあります。</div>", "<p>so の前には、職員が教えてくれた<b>モモの過去の出来事</b>が書かれています。</p><p>選択肢は「年齢」「ボランティアの態度」「食べ物」「過去にどこでどうされたか」の4タイプです。本文でモモは <b>small brown dog</b> と紹介されているだけなので、年齢の話は外れます。ボランティアは「信用しないだろう」と言っただけで、何かをしたとは書かれていません。食べ物の話も第1段落にはありません。<b>場所と出来事</b>が書かれた選択肢を探しましょう。</p>"], "explain": "<p>第1段落から、モモが人を怖がる理由を探す問題です。</p><div class=\"ans-key\">✅ 正解：② she had been left alone in a park</div><div class=\"clue-quote\">A staff member told him that Momo had been left alone in a park, so she was afraid of people.</div><p><b><span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">had been left alone in a park</span>（公園に置き去りにされていた）→ <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">she was afraid of people</span>（人を怖がっている）</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 年をとりすぎて歩けなかった</td><td>年齢の記述なし。small brown dog と紹介されているだけ</td><td class=\"ng\">×</td></tr><tr><td>② 公園に置き去りにされていた</td><td>「had been left alone in a park, so she was afraid」と一致</td><td class=\"ok\">○</td></tr><tr><td>③ ボランティアが怒鳴った</td><td>怒鳴った記述なし。ボランティアは「信用しないだろう」と言っただけ</td><td class=\"ng\">×</td></tr><tr><td>④ おやつを食べたことがない</td><td>treat は第2段落に出る語で、怖がる理由ではない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：so の前が原因、後ろが結果</b><br><b>so</b> は「だから」の意味です。so の前に原因、後ろに結果が来るので、<b>afraid of people</b>（結果）の原因は前の <b>left alone in a park</b> だとわかります。</p><p><b>判断のポイント2：同じ単語に引っ張られない</b><br>選択肢4の <b>treat</b> は本文に出てきますが、第2段落の話です。単語が同じでも、<b>どの場面の話か</b>を確認しましょう。</p><p><b>覚えておきたい単語</b>：<b>afraid of 〜</b>（〜を怖がる）、<b>leave</b>（置き去りにする）、<b>whenever</b>（〜するときはいつも）、<b>corner</b>（隅）</p>", "choices": ["she was too old to walk", "she had been left alone in a park", "the volunteers had shouted at her", "she had never eaten treats"], "choicesJa": ["年をとりすぎて歩けなかった", "公園に置き去りにされていた", "ボランティアが彼女を怒鳴った", "おやつを食べたことがなかった"], "answer": 2}, {"no": 2, "qNum": 22, "paraIdx": 1, "color": "p2", "qPre": "To help Momo, Kenta", "qPost": "", "qPreJa": "モモを助けるために、ケンタは", "qPostJa": "", "keyWords": [{"w": "sorry", "mean": "気の毒で", "kana": "ソーリー", "ac": "ソー"}, {"w": "pull", "mean": "引っ張る", "kana": "プル", "ac": "プ"}, {"w": "instead", "mean": "そうではなく", "kana": "インステッド", "ac": "ステ"}, {"w": "decided", "mean": "決めた", "kana": "ディサイディッド", "ac": "サイ"}, {"w": "quietly", "mean": "静かに", "kana": "クワイエットリー", "ac": "クワイ"}, {"w": "at first", "mean": "最初は", "kana": "アット ファースト", "ac": "ファー"}, {"w": "treat", "mean": "おやつ", "kana": "トリート", "ac": "トリ"}, {"w": "closer", "mean": "より近くへ", "kana": "クロウサー", "ac": "クロウ"}], "hints": ["<p>第2段落で、ケンタが実際にとった行動を探します。カギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>felt sorry for</td><td class='ja'>〜を気の毒に思った</td></tr><tr><td class='en'>did not try to pull</td><td class='ja'>引っ張ろうとはしなかった</td></tr><tr><td class='en'>Instead</td><td class='ja'>そうではなく</td></tr><tr><td class='en'>decided to</td><td class='ja'>〜すると決めた</td></tr><tr><td class='en'>quietly</td><td class='ja'>静かに</td></tr><tr><td class='en'>for ten minutes every week</td><td class='ja'>毎週10分間</td></tr></table>", "<p>「方法」を聞く問題では、<b>否定と、その後に続く言い換え</b>に注意します。</p><div class='strategy'><b>方法を探すルール：</b><br>① 設問の主語（Kenta）の<b>動作</b>を本文で探す<br>② <b>Instead</b>（そうではなく）は、直前を否定して<b>本当の内容</b>を導く<br>③ 否定された行動の選択肢は、反対なので外す</div><div class='step'>本文 <span class='signal-word'>He did not try to pull her out ... Instead, he decided to ...</span><span class='think-arrow'>→</span>直前で「しなかったこと」を言い、<b>Instead の後ろ</b>に実際にしたことが続きます。</div>", "<p>Instead の後ろには、<b>場所・様子・していたこと</b>の3つが書かれています。この3つと合う選択肢を選びます。</p><p>部屋を変えた話や、公園へ出かけた話は本文にありません。また、「毎週モモを部屋から引っ張り出す」は、直前で<b>did not try to</b> と否定された行動なので、正反対です。本文に書かれた3つの要素を、そのまま選択肢の言葉で確認しましょう。</p>"], "explain": "<p>第2段落から、ケンタがモモのためにした行動を探す問題です。</p><div class=\"ans-key\">✅ 正解：③ sat quietly near her room and read a book</div><div class=\"clue-quote\">He did not try to pull her out of her room. Instead, he decided to sit quietly near her room for ten minutes every week and read a book.</div><p><b><span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">decided to sit quietly near her room</span>（部屋の近くに静かに座ると決めた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">sat quietly near her room</span>（部屋の近くに静かに座った）</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 新しい部屋を与えた</td><td>部屋を変えた記述なし</td><td class=\"ng\">×</td></tr><tr><td>② 公園に連れ出した</td><td>公園は置き去りにされた場所。連れ出したとは書かれていない</td><td class=\"ng\">×</td></tr><tr><td>③ 静かに座って本を読んだ</td><td>「sit quietly near her room ... read a book」と一致</td><td class=\"ok\">○</td></tr><tr><td>④ 毎週引っ張り出した</td><td>「did not try to pull her out」と否定されており逆</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：Instead の後ろが本当の行動</b><br><b>Instead</b> は「そうではなく」の意味で、直前の内容を打ち消します。<b>did not try to pull</b> は「しなかったこと」、<b>Instead</b> の後ろが「したこと」です。</p><p><b>判断のポイント2：否定された行動は選ばない</b><br>選択肢4の「引っ張り出した」は、本文で否定された行動です。本文にある単語（pull）が選択肢に出ていても、肯定か否定かを必ず確認しましょう。</p><p><b>覚えておきたい単語</b>：<b>feel sorry for 〜</b>（〜を気の毒に思う）、<b>instead</b>（そうではなく）、<b>decide to 〜</b>（〜すると決める）、<b>quietly</b>（静かに）</p>", "choices": ["gave her a new room", "took her out to a park", "sat quietly near her room and read a book", "pulled her out of her room every week"], "choicesJa": ["彼女に新しい部屋を与えた", "彼女を公園に連れ出した", "部屋の近くに静かに座って本を読んだ", "毎週彼女を部屋から引っ張り出した"], "answer": 3}, {"no": 3, "qNum": 23, "paraIdx": 2, "color": "p3", "qPre": "When the family visited the shelter,", "qPost": "", "qPreJa": "家族が施設を訪れたとき、", "qPostJa": "", "keyWords": [{"w": "head", "mean": "責任者", "kana": "ヘッド", "ac": "ヘ"}, {"w": "soon after", "mean": "〜のすぐ後", "kana": "スーン アフター", "ac": "アフ"}, {"w": "hid", "mean": "隠れた", "kana": "ヒッド", "ac": "ヒ"}, {"w": "slowly", "mean": "ゆっくりと", "kana": "スロウリー", "ac": "スロウ"}, {"w": "feet", "mean": "足(footの複数形)", "kana": "フィート", "ac": "フィ"}, {"w": "softly", "mean": "そっと", "kana": "ソフトリー", "ac": "ソフ"}, {"w": "gentle", "mean": "やさしい", "kana": "ジェントル", "ac": "ジェン"}, {"w": "barked", "mean": "吠えた", "kana": "バークト", "ac": "バー"}], "hints": ["<p>第3段落で、家族が来たときの場面を読みます。カギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>Soon after that</td><td class='ja'>その後すぐに</td></tr><tr><td class='en'>hid at first</td><td class='ja'>最初は隠れた</td></tr><tr><td class='en'>But</td><td class='ja'>しかし</td></tr><tr><td class='en'>sat down by the door</td><td class='ja'>ドアのそばに座った</td></tr><tr><td class='en'>slowly</td><td class='ja'>ゆっくりと</td></tr><tr><td class='en'>at his feet</td><td class='ja'>彼の足元に</td></tr></table>", "<p>「そのとき何が起きたか」を聞く問題です。<b>場面の変化</b>を示す語に注目しましょう。</p><div class='strategy'><b>場面を読むルール：</b><br>① 設問の場面（家族が訪れたとき）を本文で見つける<br>② <b>But</b> は、前とは<b>反対の内容</b>を導く<br>③ <b>誰が何をしたか</b>を主語ごとに確認する</div><div class='step'>本文 <span class='signal-word'>Momo hid at first. But when Kenta sat down ...</span><span class='think-arrow'>→</span>最初は隠れていたモモが、<b>But のあとで変わった</b>ことを読み取ります。</div>", "<p>But のあとに、モモが<b>どこへ来て、どうしたか</b>が書かれています。</p><p>「吠えた」「大きい犬がほしい」は本文にありません。女の子は She is so gentle と言っているので、吠えたこととも合いません。また、モモを家に連れて帰ると決めたのは<b>家族</b>です。「誰が連れて行ったか」が違う選択肢も外れます。残るのは、モモ自身の動きを述べたものです。</p>"], "explain": "<p>第3段落から、家族が施設を訪れたときの様子を探す問題です。</p><div class=\"ans-key\">✅ 正解：④ Momo came out and sat at Kenta's feet</div><div class=\"clue-quote\">Momo hid at first. But when Kenta sat down by the door, she came out slowly and sat at his feet.</div><p><b><span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">she came out slowly and sat at his feet</span>（ゆっくり出てきて、彼の足元に座った）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">Momo came out and sat at Kenta's feet</span>（モモが出てきて、ケンタの足元に座った）</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① モモが女の子に吠えた</td><td>吠えた記述なし。女の子は「やさしい」と言っている</td><td class=\"ng\">×</td></tr><tr><td>② 家族はもっと大きな犬を望んだ</td><td>大きい犬の記述なし。家族はモモを迎えることにした</td><td class=\"ng\">×</td></tr><tr><td>③ ケンタがモモを家族の家へ</td><td>連れて帰ると決めたのは家族。ケンタが連れて行ったとは書かれていない</td><td class=\"ng\">×</td></tr><tr><td>④ モモが出てきて足元に座った</td><td>「came out slowly and sat at his feet」と一致</td><td class=\"ok\">○</td></tr></table><p><b>判断のポイント1：But の前後の変化をつかむ</b><br><b>Momo hid at first.</b>（最初は隠れた）と <b>But ... she came out</b>（しかし出てきた）は反対の動きです。第1段落で人を怖がっていたモモが変わったことが、この問題の中心です。</p><p><b>判断のポイント2：主語を確認する</b><br>選択肢3は、モモを連れて帰る人物が違います。<b>誰が何をしたか</b>を本文と照らし合わせると、場面に合わない選択肢を消せます。</p><p><b>覚えておきたい単語</b>：<b>soon after</b>（その後すぐに）、<b>at first</b>（最初は）、<b>gentle</b>（やさしい）、<b>at his feet</b>（彼の足元に）</p>", "choices": ["Momo barked loudly at the girl", "the family wanted a bigger dog", "Kenta took Momo to the family's house", "Momo came out and sat at Kenta's feet"], "choicesJa": ["モモが女の子に大声で吠えた", "家族はもっと大きな犬を望んだ", "ケンタがモモを家族の家に連れて行った", "モモが出てきて、ケンタの足元に座った"], "answer": 4}, {"no": 4, "qNum": 24, "paraIdx": 3, "color": "p4", "qPre": "Through this experience, Kenta learned that", "qPost": "", "qPreJa": "この経験を通して、ケンタが学んだことは、", "qPostJa": "", "keyWords": [{"w": "learned", "mean": "学んだ", "kana": "ラーンド", "ac": "ラー"}, {"w": "trust", "mean": "信頼", "kana": "トラスト", "ac": "トラ"}, {"w": "forced", "mean": "無理強いされた", "kana": "フォースト", "ac": "フォー"}, {"w": "grows", "mean": "育つ", "kana": "グロウズ", "ac": "グロウ"}, {"w": "care", "mean": "世話をする", "kana": "ケア", "ac": "ケ"}, {"w": "wait", "mean": "待つ", "kana": "ウェイト", "ac": "ウェ"}, {"w": "photo", "mean": "写真", "kana": "フォウトウ", "ac": "フォウ"}, {"w": "future", "mean": "将来", "kana": "フューチャー", "ac": "フュー"}, {"w": "dangerous", "mean": "危険な", "kana": "デインジャラス", "ac": "デイン"}], "hints": ["<p>第4段落の、ケンタが学んだ内容を読みます。カギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>learned that ...</td><td class='ja'>…ということを学んだ</td></tr><tr><td class='en'>trust</td><td class='ja'>信頼</td></tr><tr><td class='en'>cannot be forced</td><td class='ja'>無理強いできない</td></tr><tr><td class='en'>grows</td><td class='ja'>育つ</td></tr><tr><td class='en'>wait and care</td><td class='ja'>待って、世話をする</td></tr><tr><td class='en'>in the future</td><td class='ja'>将来</td></tr></table>", "<p>「学んだこと」を聞く問題では、<b>learned that のあと</b>に答えがあります。</p><div class='strategy'><b>教訓を探すルール：</b><br>① <b>learned that / realized that</b> のあとに注目<br>② 1文で終わらず、<b>次の文で言い換えや補足</b>が続くことが多い<br>③ 選択肢は、本文の言葉を<b>別の表現に言いかえた形</b>になりやすい</div><div class='step'>本文 <span class='signal-word'>He learned that trust cannot be forced.</span><span class='think-arrow'>→</span>まず「信頼は無理にはできない」。<b>次の文</b>で、<b>どうすれば育つか</b>が続きます。</div>", "<p>2文目に書かれた<b>育つための条件</b>を、別の言葉で言いかえた選択肢を探します。</p><p>公園で見つかった犬が「いつも危険」だという話はありません。モモはむしろ「やさしい」と言われています。施設が犬を受け入れるべきでないという話も、毎日働かなければならないという話も、本文にはありません。ケンタは毎週日曜日に来ていたと第1段落に書かれています。本文の内容と<b>同じ意味</b>になっているかを確かめましょう。</p>"], "explain": "<p>第4段落から、ケンタが学んだことを探す問題です。</p><div class=\"ans-key\">✅ 正解：① trust grows when you give time and care</div><div class=\"clue-quote\">He learned that trust cannot be forced. It grows when you wait and care.</div><p><b><span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">wait and care</span>（待って、世話をする）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">give time and care</span>（時間と世話を与える）</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 信頼は時間と世話で育つ</td><td>「It grows when you wait and care」を言いかえた内容と一致</td><td class=\"ok\">○</td></tr><tr><td>② 公園の犬は危険</td><td>危険の記述なし。モモは gentle と言われている</td><td class=\"ng\">×</td></tr><tr><td>③ 施設は犬を受け入れるべきでない</td><td>そのような記述なし</td><td class=\"ng\">×</td></tr><tr><td>④ ボランティアは毎日働くべき</td><td>毎日の記述なし。ケンタは毎週日曜日に来ていた</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：learned that の後ろが教訓</b><br><b>He learned that ...</b> の後ろが、ケンタの学んだことです。<b>trust cannot be forced</b> と <b>It grows when you wait and care</b> の2文をセットで読みましょう。</p><p><b>判断のポイント2：言いかえに気づく</b><br>本文の <b>wait</b>（待つ）が、選択肢では <b>give time</b>（時間を与える）になっています。同じ意味の別の表現を見つける練習をしましょう。</p><p><b>覚えておきたい単語</b>：<b>trust</b>（信頼）、<b>force</b>（無理強いする）、<b>grow</b>（育つ）、<b>care</b>（世話をする）、<b>dangerous</b>（危険な）</p>", "choices": ["trust grows when you give time and care", "dogs from parks are always dangerous", "shelters should not take in dogs", "volunteers must work every day"], "choicesJa": ["信頼は時間と世話を与えれば育つ", "公園出身の犬はいつも危険だ", "施設は犬を受け入れるべきではない", "ボランティアは毎日働かなければならない"], "answer": 1}]}, "Set-E": {"storyTitle": "Lanterns in the Hall", "topicJa": "地域行事：台風で中止になった灯籠祭りを、アイデアで救う話", "paragraphs": [{"summary": "リナが子どもたちと灯籠を作る", "en": "Every August, Rina's town holds a lantern festival along the river. This year, Rina, a fifteen-year-old girl, was asked to lead the lantern-making team for the first time. For two weeks, she worked with the neighborhood children after school. Many children came every day, even during the hot summer vacation. They cut paper, drew pictures, and put small lights inside. In the end, they made three hundred lanterns. Rina was very proud of them.", "ja": "毎年8月、リナの町では川沿いで灯籠祭りが開かれます。今年、15歳の少女リナは、初めて灯籠作りのチームのリーダーを頼まれました。2週間、彼女は放課後に近所の子どもたちと一緒に作業しました。暑い夏休み中でも、たくさんの子どもたちが毎日来ました。彼らは紙を切り、絵をかき、中に小さな明かりを入れました。最終的に、彼らは300個の灯籠を作りました。リナはそれをとても誇りに思いました。"}, {"summary": "台風で夜の行事が中止に", "en": "Two days before the festival, the weather news said that a strong typhoon was coming. The festival committee decided to cancel the evening event because the river would be dangerous. Rina was very disappointed. \"We worked so hard, and now nobody will see the lanterns,\" she said to her grandfather. He thought for a moment and answered, \"The festival may be canceled, but the lanterns are still yours.\"", "ja": "祭りの2日前、天気予報は強い台風が来ると伝えました。川が危険になるため、祭りの委員会は夜の行事を中止すると決めました。リナはとてもがっかりしました。「あんなに一生懸命作ったのに、だれも灯籠を見てくれないのね」と彼女は祖父に言いました。祖父はしばらく考えて、「祭りは中止になるかもしれないが、灯籠はまだおまえのものだよ」と答えました。"}, {"summary": "公民館で灯籠を飾るひらめき", "en": "His words gave Rina an idea. After the typhoon passed, she asked the children and their parents to carry the lanterns to the town hall. She also asked the staff there to lend them the big hall. Many people came to help, and they hung the lanterns from the ceiling in only one afternoon. When the lights were turned on in the evening, the hall glowed warmly. Even elderly people who could not walk to the river came to enjoy the view.", "ja": "祖父の言葉はリナにひらめきを与えました。台風が過ぎたあと、彼女は子どもたちとその親に、灯籠を公民館まで運んでくれるよう頼みました。また、そこの職員に、大きなホールを貸してくれるよう頼みました。多くの人が手伝いに来て、たった1日の午後で灯籠を天井からつるしました。夕方に明かりがつくと、ホールはやわらかく輝きました。川まで歩いて行けない年配の人たちも、その景色を楽しみに来ました。"}, {"summary": "成功と学んだ2つのこと", "en": "The children shouted happily, and many visitors took pictures. Rina felt tears in her eyes, and the elderly visitors thanked her again and again. She had thought that everything was lost, but a new idea had saved it. She learned that when plans suddenly change, there is often another way, and that people are glad to help when you ask them.", "ja": "子どもたちは喜んで歓声をあげ、多くの訪問者が写真を撮りました。リナは目に涙を感じ、年配の訪問者たちは何度も彼女に感謝しました。彼女はすべてが失われたと思っていましたが、新しいアイデアがそれを救ったのです。彼女は、計画が急に変わっても別の方法がよくあること、そして頼めば人は喜んで助けてくれることを学びました。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "Rina was proud because", "qPost": ".", "qPreJa": "リナが誇りに思ったのは、", "qPostJa": "からです。", "choices": ["she had won a prize", "she was the oldest in the town", "she and the children had made three hundred lanterns", "her grandfather had helped her"], "choicesJa": ["賞をもらった", "町で一番年上だった", "彼女と子どもたちが300個の灯籠を作った", "祖父が彼女を手伝った"], "answer": 3, "keyWords": [{"w": "festival", "mean": "祭り", "kana": "フェスティヴァル", "ac": "ティ"}, {"w": "lead", "mean": "率いる", "kana": "リード", "ac": "リー"}, {"w": "for the first time", "mean": "初めて", "kana": "フォーザファーストタイム", "ac": "ファースト"}, {"w": "neighborhood", "mean": "近所", "kana": "ネイバーフッド", "ac": "ネイ"}, {"w": "vacation", "mean": "休暇", "kana": "ヴェイケイション", "ac": "ケイ"}, {"w": "lanterns", "mean": "灯籠", "kana": "ランタンズ", "ac": "ラン"}, {"w": "in the end", "mean": "最終的に", "kana": "インジエンド", "ac": "エンド"}, {"w": "proud", "mean": "誇りに思う", "kana": "プラウド", "ac": "プラウ"}], "hints": ["<p>この設問は<b>第1段落</b>から答えを探します。「誇りに思う」の理由を聞かれているので、<b>proud</b> のまわりの語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>proud of ~</td><td class='ja'>~を誇りに思う</td></tr><tr><td class='en'>in the end</td><td class='ja'>最終的に</td></tr><tr><td class='en'>neighborhood children</td><td class='ja'>近所の子どもたち</td></tr><tr><td class='en'>for the first time</td><td class='ja'>初めて</td></tr><tr><td class='en'>lead</td><td class='ja'>率いる・リーダーを務める</td></tr><tr><td class='en'>them</td><td class='ja'>それら（直前に出た複数のものを指す）</td></tr></table>", "<p>理由を聞く問題は、<b>気持ちを表す語</b>（proud）と<b>その直前の文</b>をセットで読むのがコツです。</p><div class='strategy'><b>読解ルール：</b><br>① 設問のキーワード（proud）を本文で探す<span class='think-arrow'>→</span>第1段落の最後<br>② 代名詞（them）は<b>直前の文</b>の名詞を指す<br>③ 「だれが」「何を」までセットで確認する</div><div class='step'>第1段落の最後 <span class='signal-word'>Rina was very proud of them.</span><span class='think-arrow'>→</span><b>them</b> が何を指すのかを、1つ前の文で確認しましょう。</div><div class='step'>直前の文 <span class='signal-word'>In the end, they made ...</span><span class='think-arrow'>→</span><b>they</b> は<b>だれ</b>のことか、何を作ったのかを読み取りましょう。</div>", "<p>ここまでで分かったのは、誇りの理由が<b>「作ったもの」</b>とその<b>「数」</b>だということです。次の2点で選択肢を絞りましょう。</p><p>① 本文に書かれていない話（<b>賞</b>、町での<b>年齢の順</b>など）の選択肢は外れます。<br>② <b>祖父</b>が出てくるのは別の段落です。第1段落の内容と合うか確認しましょう。</p><p>残った選択肢のうち、<b>they（作った人たち）</b>と<b>作ったものの数</b>が本文と合っているほうが正解です。</p>"], "explain": "<p>第1段落から「誇りに思った理由」を探す問題です。</p><div class=\"ans-key\">✅ 正解：③ she and the children had made three hundred lanterns</div><div class=\"clue-quote\">In the end, they made three hundred lanterns. Rina was very proud of them.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">they made three hundred lanterns</span>（300個の灯籠を作った）+ <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">proud of them</span>（それらを誇りに思った）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">she and the children had made three hundred lanterns</span>（彼女と子どもたちが300個の灯籠を作った）。<b>them</b> は直前の <b>lanterns</b> を指します。</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 賞をもらった</td><td>賞の話は本文のどこにもない</td><td class=\"ng\">×</td></tr><tr><td>② 町で一番年上</td><td>リナは15歳の少女と書かれているだけで、年齢の比較はない</td><td class=\"ng\">×</td></tr><tr><td>③ 彼女と子どもたちが300個の灯籠を作った</td><td>「they made three hundred lanterns」「proud of them」と一致。they はリナと子どもたち</td><td class=\"ok\">○</td></tr><tr><td>④ 祖父が手伝った</td><td>祖父が出てくるのは第2段落で、灯籠作りを手伝ったとは書かれていない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：代名詞 them の指すものを確認する</b><br><b>Rina was very proud of them.</b> の <b>them</b> は、すぐ前の文の <b>three hundred lanterns</b> を指します。代名詞が出てきたら、<b>直前の名詞</b>に戻って確認しましょう。</p><p><b>判断のポイント2：本文にない情報の選択肢を外す</b><br>「賞」「町で一番年上」は本文に出てきません。本文に根拠がない選択肢は、もっともらしくても×です。</p><p><b>覚えておきたい単語</b>：<b>proud of ~</b>（~を誇りに思う）、<b>in the end</b>（最終的に）、<b>neighborhood</b>（近所）、<b>lead</b>（率いる）。</p>"}, {"no": 2, "qNum": 22, "paraIdx": 1, "color": "p2", "qPre": "The evening event was canceled because", "qPost": ".", "qPreJa": "夜の行事が中止になったのは、", "qPostJa": "からです。", "choices": ["a strong typhoon was coming", "there were not enough lanterns", "Rina was sick", "the river was too dirty"], "choicesJa": ["強い台風が来ていた", "灯籠が足りなかった", "リナが病気だった", "川が汚れすぎていた"], "answer": 1, "keyWords": [{"w": "typhoon", "mean": "台風", "kana": "タイフーン", "ac": "フー"}, {"w": "weather", "mean": "天気", "kana": "ウェザー", "ac": "ウェ"}, {"w": "committee", "mean": "委員会", "kana": "コミティー", "ac": "ミ"}, {"w": "cancel", "mean": "中止する", "kana": "キャンセル", "ac": "キャン"}, {"w": "dangerous", "mean": "危険な", "kana": "デインジャラス", "ac": "デイン"}, {"w": "river", "mean": "川", "kana": "リヴァー", "ac": "リ"}, {"w": "disappointed", "mean": "がっかりした", "kana": "ディサポインティド", "ac": "ポイン"}, {"w": "nobody", "mean": "だれも~ない", "kana": "ノウバディ", "ac": "ノウ"}], "hints": ["<p>この設問は<b>第2段落</b>を見ます。「中止」を表す語と、理由を示す語に注目しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>cancel</td><td class='ja'>中止する</td></tr><tr><td class='en'>because</td><td class='ja'>なぜなら（理由を示す）</td></tr><tr><td class='en'>weather news</td><td class='ja'>天気予報</td></tr><tr><td class='en'>committee</td><td class='ja'>委員会</td></tr><tr><td class='en'>dangerous</td><td class='ja'>危険な</td></tr><tr><td class='en'>disappointed</td><td class='ja'>がっかりした</td></tr></table>", "<p>「なぜ中止になったか」は、<b>because の後ろ</b>に書かれるのが基本です。</p><div class='strategy'><b>読解ルール：</b><br>① <b>because</b>（なぜなら）の後ろに<b>理由</b>が来る<br>② 理由の<b>大もと</b>は、少し前の文に書かれていることもある<br>③ 似た単語の<b>一語違い</b>に注意する</div><div class='step'>第2段落 <span class='signal-word'>decided to cancel the evening event because ...</span><span class='think-arrow'>→</span>because のあとにある<b>形容詞</b>を確認しましょう。</div><div class='step'>同じ段落の最初の文 <span class='signal-word'>the weather news said that ...</span><span class='think-arrow'>→</span><b>天気予報が何を伝えたか</b>も、理由に関係しています。</div>", "<p>理由は<b>天気に関すること</b>です。選択肢を次のように絞りましょう。</p><p>① <b>灯籠の数</b>や<b>リナの体調</b>は、本文では話題になっていないので外れます。<br>② <b>川</b>に関する選択肢は、本文の形容詞と<b>一語ずつ</b>比べましょう。意味が違う語に変えられていないでしょうか。</p><p>残る選択肢は、<b>天気予報が伝えた内容</b>を言い換えたものです。</p>"], "explain": "<p>第2段落から「行事が中止になった理由」を探す問題です。</p><div class=\"ans-key\">✅ 正解：① a strong typhoon was coming</div><div class=\"clue-quote\">Two days before the festival, ren are better leaders than adults", "a new idea can help when plans change"], "choicesJa": ["祭りは決して中止にすべきでない", "台風は人の力で止められる", "子どもは大人よりよいリーダーだ", "新しい考えは計画が変わったときに役立つ"], "answer": 4, "keyWords": [{"w": "shouted", "mean": "叫んだ", "kana": "シャウティド", "ac": "シャウ"}, {"w": "tears", "mean": "涙", "kana": "ティアーズ", "ac": "ティア"}, {"w": "again and again", "mean": "何度も何度も", "kana": "アゲインアンドアゲイン", "ac": "ゲイン"}, {"w": "lost", "mean": "失われた", "kana": "ロスト", "ac": "ロス"}, {"w": "saved", "mean": "救った", "kana": "セイヴド", "ac": "セイ"}, {"w": "learned", "mean": "学んだ", "kana": "ラーンド", "ac": "ラー"}, {"w": "suddenly", "mean": "急に", "kana": "サドゥンリー", "ac": "サド"}, {"w": "glad", "mean": "うれしい", "kana": "グラッド", "ac": "グラ"}, {"w": "visitors", "mean": "訪問者", "kana": "ヴィジターズ", "ac": "ジタ"}], "hints": ["<p>この設問は<b>第4段落</b>、特に<b>最後の文</b>を見ます。「学んだこと」を表す表現に注目しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>learned that ~</td><td class='ja'>~ということを学んだ</td></tr><tr><td class='en'>suddenly</td><td class='ja'>急に</td></tr><tr><td class='en'>another way</td><td class='ja'>別の方法</td></tr><tr><td class='en'>glad to ~</td><td class='ja'>~してうれしい</td></tr><tr><td class='en'>had thought</td><td class='ja'>思っていた（過去完了）</td></tr><tr><td class='en'>saved</td><td class='ja'>救った</td></tr></table>", "<p>「学んだこと」は、<b>learned that</b> の<b>後ろ</b>に書かれています。</p><div class='strategy'><b>読解ルール：</b><br>① <b>learned that ~</b>（~と学んだ）の後ろが<b>教訓</b><br>② 教訓は<b>最終段落の最後</b>に書かれることが多い<br>③ 選択肢は本文の<b>言い換え</b>になっている</div><div class='step'>最後の文 <span class='signal-word'>She learned that when plans suddenly change, ...</span><span class='think-arrow'>→</span>計画が急に変わったとき、どうだとリナは学んだのでしょうか。</div><div class='step'>その前の文 <span class='signal-word'>a new idea had saved it</span><span class='think-arrow'>→</span>何が「救った」のかも手がかりになります。</div>", "<p>本文の教訓は<b>前向きな内容</b>です。選択肢を次のように絞りましょう。</p><p>① <b>never</b>（決して~ない）のような<b>極端な言い方</b>の選択肢は、本文の内容と合いません。<br>② 本文にない話（<b>台風を止める</b>など）の選択肢は外れます。<br>③ <b>子どもと大人</b>を比べる記述もありません。</p><p>残るのは、<b>計画が変わったとき</b>に何が役立つかを述べた選択肢です。</p>"], "explain": "<p>第4段落から「リナが学んだこと」を探す問題です。</p><div class=\"ans-key\">✅ 正解：④ a new idea can help when plans change</div><div class=\"clue-quote\">She had thought that everything was lost, but a new idea had saved it. She learned that when plans suddenly change, there is often another way, and that people are glad to help when you ask them.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">when plans suddenly change, there is often another way</span>（計画が急に変わっても、別の方法がよくある）+ <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">a new idea had saved it</span>（新しい考えがそれを救った）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">a new idea can help when plans change</span>（計画が変わったとき、新しい考えが役立つ）。同じ趣旨を、短くまとめた言い換えです。</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 祭りは決して中止にすべきでない</td><td>中止になった祭りを別の形で楽しめたので合わない。<b>never</b> も極端な言い方</td><td class=\"ng\">×</td></tr><tr><td>② 台風は人の力で止められる</td><td>台風を止める話はない。リナは台風のあとの対応を考えただけ</td><td class=\"ng\">×</td></tr><tr><td>③ 子どもは大人よりよいリーダーだ</td><td>子どもと大人を比べる記述はない。リナも大人の助けを借りている</td><td class=\"ng\">×</td></tr><tr><td>④ 新しい考えは計画が変わったときに役立つ</td><td>「a new idea had saved it」「there is often another way」と一致</td><td class=\"ok\">○</td></tr></table><p><b>判断のポイント1：learned that の後ろが答え</b><br><b>She learned that ~</b> の後ろに教訓が書かれます。最終段落の最後に <b>learned</b> が出てきたら、そこが答えの場所です。</p><p><b>判断のポイント2：極端な言葉に注意する</b><br>①の <b>never</b>（決して~ない）のように、<b>極端な言葉</b>を含む選択肢は、本文に根拠がないことが多いです。本文の <b>often</b>（よく）のようなやわらかい表現と比べましょう。</p><p><b>覚えておきたい単語</b>：<b>learned that ~</b>（~ということを学んだ）、<b>suddenly</b>（急に）、<b>saved</b>（救った）、<b>be glad to ~</b>（~してうれしい）。</p>"}]}, "Set-F": {"storyTitle": "Mr. Hayashi's Speech", "topicJa": "社会人の学び直し：年下の仲間と練習してスピーチに挑む話", "paragraphs": [{"summary": "年下ばかりで内気になる", "en": "Mr. Hayashi was thirty-eight years old. He had left high school at seventeen and had worked at a factory for twenty years. Last spring, he decided to finish high school. He began to study in the evening at a small learning center to prepare for the high school equivalency exam. Most of his classmates were much younger than he was, so he often felt shy and sat alone.", "ja": "ハヤシさんは38歳でした。17歳で高校をやめ、20年間工場で働いてきました。昨年の春、彼は高校を卒業しようと決心しました。高校卒業程度認定試験の準備のため、小さな学習センターで夜に勉強を始めました。クラスメイトのほとんどが彼よりずっと若かったので、彼はよく恥ずかしく感じ、一人で座っていました。"}, {"summary": "スピーチをやめようと悩む", "en": "In October, the center held an open day for families and neighbors. Every student was asked to give a short speech in English about their dream. Mr. Hayashi's heart beat fast just thinking about it. For a week, he practiced alone at home every night, but he kept forgetting the words. One day he told his teacher, \"I am too old for this. Maybe I should skip the speech.\"", "ja": "10月に、センターは家族や近所の人のための公開日を開きました。生徒は全員、自分の夢について英語で短いスピーチをするよう求められました。ハヤシさんは、そのことを考えるだけで心臓がどきどきしました。1週間、彼は毎晩家で一人で練習しましたが、言葉を忘れ続けました。ある日、彼は先生に「私はこれをやるには年を取りすぎています。スピーチはやめたほうがいいかもしれません」と言いました。"}, {"summary": "年下の仲間が練習を手伝う", "en": "A young classmate named Yuna heard this. \"Let's practice together,\" she said with a smile. Soon, three or four younger students joined them after class. They corrected his pronunciation and taught him to look at the audience while speaking. In return, Mr. Hayashi explained math problems to them, using examples from his factory work. For the first time, he did not feel alone in the classroom.", "ja": "ユナという若いクラスメイトがこれを聞きました。「一緒に練習しましょう」と彼女は笑顔で言いました。まもなく、3、4人の年下の生徒が放課後に加わりました。彼らは彼の発音を直し、話しながら聴衆を見ることを教えました。お返しに、ハヤシさんは工場での仕事の例を使って、彼らに数学の問題を説明しました。生まれて初めて、彼は教室で孤独を感じませんでした。"}, {"summary": "スピーチ成功と気づき", "en": "On the open day, Mr. Hayashi stood in front of the people and began slowly. \"My dream is to keep learning new things at any age.\" His voice shook at first, but he finished the speech. The room was filled with warm applause, and Yuna gave him a thumbs-up from her seat. He realized that age does not matter, and that studying with others can make a person stronger.", "ja": "公開日、ハヤシさんは人々の前に立ち、ゆっくり話し始めました。「私の夢は、何歳になっても新しいことを学び続けることです」。最初は声が震えましたが、彼はスピーチをやり遂げました。部屋は温かい拍手に包まれ、ユナは席から彼にグッドサインを送りました。彼は、年齢は関係ないこと、そして仲間と一緒に学ぶと人は強くなれることに気づきました。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "At the learning center, Mr. Hayashi felt shy because", "qPost": "", "qPreJa": "学習センターで、ハヤシさんが恥ずかしく感じたのは、", "qPostJa": "", "choices": ["most of his classmates were much younger", "he could not read English at all", "he had never worked before", "the teacher was strict with him"], "choicesJa": ["クラスメイトのほとんどがずっと若かった", "英語がまったく読めなかった", "それまで働いたことがなかった", "先生が彼に厳しかった"], "answer": 1, "keyWords": [{"w": "decided", "mean": "決心した", "kana": "ディサイディド", "ac": "サイ"}, {"w": "equivalency exam", "mean": "高校卒業程度認定試験", "kana": "イクウィヴァレンシー イグザム", "ac": "ヴァ"}, {"w": "prepare", "mean": "準備する", "kana": "プリペア", "ac": "ペア"}, {"w": "classmates", "mean": "クラスメイト", "kana": "クラスメイツ", "ac": "クラス"}, {"w": "younger", "mean": "より若い", "kana": "ヤンガー", "ac": "ヤン"}, {"w": "shy", "mean": "恥ずかしがりの", "kana": "シャイ", "ac": "シャイ"}, {"w": "alone", "mean": "一人で", "kana": "アローン", "ac": "ロー"}, {"w": "factory", "mean": "工場", "kana": "ファクトリー", "ac": "ファク"}, {"w": "often", "mean": "よく", "kana": "オフン", "ac": "オフ"}], "hints": ["<p>第1段落のカギの単語を確認しましょう。設問は「なぜ恥ずかしく感じたか」という<b>理由</b>を聞いています。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>decided to ~</td><td class='ja'>〜しようと決めた</td></tr><tr><td class='en'>prepare for ~</td><td class='ja'>〜の準備をする</td></tr><tr><td class='en'>equivalency exam</td><td class='ja'>高校卒業程度認定試験（高認）</td></tr><tr><td class='en'>shy</td><td class='ja'>恥ずかしがりの・内気な</td></tr><tr><td class='en'>sat alone</td><td class='ja'>一人で座っていた</td></tr><tr><td class='en'>so</td><td class='ja'>だから（前が理由、後ろが結果）</td></tr></table>", "<p>「理由」を聞く問題の見つけ方を確認しましょう。</p><div class='strategy'><b>理由を探す読解ルール：</b><br>① 設問の<b>キーワード</b>（felt shy）を本文で探す<br>② <b>so</b>（だから）は<b>前が理由・後ろが結果</b><span class='think-arrow'>→</span>so の前を読む<br>③ 理由は選択肢で<b>言い換えられている</b>ことが多い</div><div class='step'>第1段落の最終文に <span class='signal-word'>he often felt shy and sat alone</span><span class='think-arrow'>→</span>（よく恥ずかしく感じ、一人で座っていた）がありますね。ここが設問の「felt shy」の部分です。</div><div class='step'>その直前の <span class='signal-word'>so</span><span class='think-arrow'>→</span>の<b>前</b>に何が書いてあるか読みましょう。<b>クラスメイトについての説明</b>が理由になっています。</div>", "<p>選択肢を絞りこみましょう。</p><p>② 本文に<b>英語の読み書き</b>の話は出てきません。③ 第1段落には<b>20年間工場で働いた</b>とあり、「働いたことがない」とは合いません。④ <b>先生の態度</b>は第1段落に書かれていません。</p><p>残るのは、so の前の内容、つまり<b>クラスメイトの年齢</b>を言い換えた選択肢です。</p>"], "explain": "<p>第1段落から「恥ずかしく感じた理由」を探す問題です。</p><div class=\"ans-key\">✅ 正解：① most of his classmates were much younger</div><div class=\"clue-quote\">Most of his classmates were much younger than he was, so he often felt shy and sat alone.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">so he often felt shy</span>（だから、よく恥ずかしく感じた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">felt shy because ...</span>（〜ので恥ずかしく感じた）。<br>本文は「理由 → <b>so</b> → 結果」の順ですが、設問は「結果 + <b>because</b> + 理由」の順です。順番が入れかわっているだけで、同じ内容です。</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① クラスメイトの年齢</td><td>本文「Most of his classmates were much younger」と一致</td><td class=\"ok\">○</td></tr><tr><td>② 英語が読めない</td><td>英語が読めないという記述は本文にない</td><td class=\"ng\">×</td></tr><tr><td>③ 働いたことがない</td><td>第1段落に「worked at a factory for twenty years」（工場で20年働いた）とあり<b>反対</b></td><td class=\"ng\">×</td></tr><tr><td>④ 先生が厳しい</td><td>先生が厳しいという記述は本文にない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：<b>so</b> の前後を見分ける</b><br>「A, so B」は「Aだから B」。<b>A が理由、B が結果</b>です。設問の felt shy は結果 B なので、理由 A（クラスメイトが年下だった）が答えになります。</p><p><b>判断のポイント2：本文にない話は選ばない</b><br>②の英語力や④の先生の話は、本文に<b>一言も書かれていません</b>。「ありそうだな」で選ばず、本文に書いてあることだけを根拠にしましょう。</p><p><b>覚えておきたい単語</b>：<b>shy</b>（恥ずかしがりの）、<b>younger than ~</b>（〜より若い）、<b>so</b>（だから）、<b>prepare for ~</b>（〜の準備をする）。</p>"}, {"no": 2, "qNum": 22, "paraIdx": 1, "color": "p2", "qPre": "Before the open day, Mr. Hayashi thought about", "qPost": "", "qPreJa": "公開日の前、ハヤシさんが考えたのは、", "qPostJa": "", "choices": ["changing his teacher", "asking for a day off from work", "inviting his family to the center", "skipping the speech"], "choicesJa": ["先生を変える", "仕事の休みを取る", "家族をセンターに招待する", "スピーチをとばす"], "answer": 4, "keyWords": [{"w": "open day", "mean": "公開日", "kana": "オープン デイ", "ac": "オープン"}, {"w": "neighbors", "mean": "近所の人々", "kana": "ネイバーズ", "ac": "ネイ"}, {"w": "speech", "mean": "スピーチ", "kana": "スピーチ", "ac": "ピー"}, {"w": "dream", "mean": "夢", "kana": "ドリーム", "ac": "ドリー"}, {"w": "practiced", "mean": "練習した", "kana": "プラクティスト", "ac": "プラ"}, {"w": "forgetting", "mean": "忘れる（-ing形）", "kana": "フォゲティング", "ac": "ゲ"}, {"w": "teacher", "mean": "先生", "kana": "ティーチャー", "ac": "ティー"}, {"w": "skip", "mean": "とばす・やめる", "kana": "スキップ", "ac": "スキ"}, {"w": "too old", "mean": "年を取りすぎている", "kana": "トゥー オウルド", "ac": "オウ"}], "hints": ["<p>第2段落のカギの単語を確認しましょう。設問は「公開日の前に何を考えたか」を聞いています。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>open day</td><td class='ja'>公開日</td></tr><tr><td class='en'>be asked to ~</td><td class='ja'>〜するよう求められる</td></tr><tr><td class='en'>give a speech</td><td class='ja'>スピーチをする</td></tr><tr><td class='en'>kept forgetting</td><td class='ja'>忘れ続けた</td></tr><tr><td class='en'>too old for this</td><td class='ja'>これをやるには年を取りすぎている</td></tr><tr><td class='en'>Maybe I should ~</td><td class='ja'>〜したほうがいいかもしれない</td></tr></table>", "<p>「考えていたこと」は、本人の<b>セリフ</b>に出ることがあります。</p><div class='strategy'><b>考えを探す読解ルール：</b><br>① 設問の<b>時</b>（Before the open day）を確認<span class='think-arrow'>→</span>第2段落の公開日前の場面<br>② <b>引用符 \" \"</b> の中は本人のことば<br>③ <b>Maybe I should ~</b> は「〜しようかな」という本人の考え</div><div class='step'>第2段落の最後で、彼は先生にこう言います。<span class='signal-word'>One day he told his teacher, \"I am too old for this. Maybe I should ...\"</span><span class='think-arrow'>→</span>（私はこれには年を取りすぎている。〜したほうがいいかもしれない）</div><div class='step'>Maybe I should の<b>後ろ</b>に出てくる動詞と名詞が、彼の考えていたことです。<span class='signal-word'>skip</span><span class='think-arrow'>→</span>の意味を確認して、その後ろの名詞も見ましょう。</div>", "<p>選択肢を絞りこみましょう。</p><p>① <b>先生を変える</b>話は本文にありません（先生は相談相手として出てくるだけです）。② <b>仕事を休む</b>話もありません。③ <b>families</b> は公開日の説明に出てくる単語ですが、彼が招待を考えたとは書かれていません。</p><p>単語が出てくるだけの選択肢に引っかからず、彼のセリフの Maybe I should の後ろを<b>言い換えた</b>選択肢を選びましょう。</p>"], "explain": "<p>第2段落「公開日の前に彼が考えたこと」を聞く問題です。</p><div class=\"ans-key\">✅ 正解：④ skipping the speech</div><div class=\"clue-quote\">One day he told his teacher, \"I am too old for this. Maybe I should skip the speech.\"</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">Maybe I should skip the speech</span>（スピーチをやめたほうがいいかもしれない）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">thought about skipping the speech</span>（スピーチをとばすことを考えた）。<br>ハヤシさんのセリフ「Maybe I should ~」は「〜しようかな」という<b>考え</b>なので、設問の <b>thought about ~</b> に当たります。skip は「とばす・やめる」という意味です。</b></p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 先生を変える</td><td>本文に先生を変えたいという記述はない（先生は相談相手）</td><td class=\"ng\">×</td></tr><tr><td>② 仕事の休みを取る</td><td>本文に仕事の休みの話はない</td><td class=\"ng\">×</td></tr><tr><td>③ 家族を招待する</td><td>families は公開日の説明に出るだけで、招待を考えたとは書かれていない</td><td class=\"ng\">×</td></tr><tr><td>④ スピーチをとばす</td><td>「Maybe I should skip the speech」と一致</td><td class=\"ok\">○</td></tr></table><p><b>判断のポイント1：<b>skip</b> の意味</b><br>skip は「とばす・省く」です。<b>skip the speech</b> は「スピーチをとばす＝やめる」。ski     <div class="story-content ${storyExpanded ? '' : 'collapsed'}" id="storyContent">
      ${parasHtml}

  `;
}

// ==================== 設問タブ ====================
function renderTabs(){
  const tabs = document.getElementById('qTabs');
  const data = QUESTIONS_DATA[currentYear];
  tabs.innerHTML = '';
  data.questions.forEach((q, i)=>{
