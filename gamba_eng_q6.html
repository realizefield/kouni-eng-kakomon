<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高認英語 第6問 類題演習 | GAMBA</title>
<style>
:root{
  --bg:#fef9f3;
  --paper:#ffffff;
  --ink:#2b2b2b;
  --accent:#d94f4f;
  --accent2:#2c5f8d;
  --accent3:#e8a838;
  --soft:#f3ece1;
  --line:#d8cfc0;
  --hint:#fff5e0;
  --good:#3d8b5a;
  --shadow:0 2px 0 rgba(0,0,0,.06);
  /* 段落カラー */
  --p1:#2c5f8d; /* 青 */
  --p2:#3d8b5a; /* 緑 */
  --p3:#e8a838; /* オレンジ */
  --p4:#d94f4f; /* 赤 */
  --p1-bg:#e3edf5;
  --p2-bg:#e3f1e7;
  --p3-bg:#fcefd2;
  --p4-bg:#fce0e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic",-apple-system,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
body{padding:12px;max-width:780px;margin:0 auto;padding-bottom:80px}

header{background:linear-gradient(135deg,var(--accent2),#1a4870);color:#fff;padding:18px 16px;border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;letter-spacing:.02em;margin-bottom:4px}
header p{font-size:.82rem;opacity:.92}
.badge{display:inline-block;background:var(--accent3);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:8px;font-weight:700;margin-right:6px}

.tip-banner{background:linear-gradient(135deg,#e8f4ff,#d4eaff);border:1px solid #a0c8e8;padding:10px 14px;border-radius:10px;font-size:.82rem;color:#1a4870;margin-bottom:12px;line-height:1.6}
.tip-banner b{color:var(--accent)}

.year-pick{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.year-pick button{flex:1;min-width:80px;padding:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--ink)}
.year-pick button.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}

/* 段落俯瞰ビュー */
.story-overview{background:var(--paper);border-radius:14px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.story-overview .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.story-overview h3{font-size:.95rem;color:var(--accent2);font-weight:800;display:flex;align-items:center;gap:6px}
.story-overview .ov-controls{display:flex;gap:6px}
.story-overview .ov-toggle{background:var(--paper);border:1.5px solid var(--accent2);color:var(--accent2);border-radius:6px;font-size:.74rem;font-weight:700;padding:5px 10px;cursor:pointer;font-family:inherit}
.story-overview .ov-toggle:hover{background:var(--soft)}
.story-overview .ov-play{background:linear-gradient(135deg,var(--accent),#b73e3e);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-weight:700;font-size:.74rem;cursor:pointer;font-family:inherit}

.story-title{text-align:center;font-weight:800;font-size:1rem;color:var(--accent2);margin-bottom:10px;padding:6px 0;border-top:2px solid var(--accent2);border-bottom:2px solid var(--accent2);font-family:"Georgia",serif}

.para-row{display:flex;gap:10px;margin-bottom:10px;align-items:stretch}
.para-row:last-child{margin-bottom:0}
.para-tag{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;font-weight:800;font-size:.72rem;color:#fff;border-radius:6px;text-align:center;line-height:1.2}
.para-tag.p1{background:var(--p1)}
.para-tag.p2{background:var(--p2)}
.para-tag.p3{background:var(--p3);color:#5a3a10}
.para-tag.p4{background:var(--p4)}
.para-tag .ptag-num{font-size:.95rem;display:block;margin-top:2px}
.para-tag .ptag-q{font-size:.65rem;display:block;margin-top:2px;background:rgba(255,255,255,.4);padding:1px 4px;border-radius:3px;color:inherit}
.para-tag.p3 .ptag-q{background:rgba(255,255,255,.6)}

.para-body{flex:1;padding:10px 12px;border-radius:6px;font-family:"Georgia",serif;font-size:.92rem;line-height:1.75}
.para-body.p1{background:var(--p1-bg);border-left:3px solid var(--p1)}
.para-body.p2{background:var(--p2-bg);border-left:3px solid var(--p2)}
.para-body.p3{background:var(--p3-bg);border-left:3px solid var(--p3)}
.para-body.p4{background:var(--p4-bg);border-left:3px solid var(--p4)}

.story-overview .story-content.collapsed .para-body{
  max-height:3.6em;overflow:hidden;position:relative;
}
.story-overview .story-content.collapsed .para-body::after{
  content:"...";position:absolute;bottom:4px;right:8px;color:#666;font-size:.85rem;background:inherit;padding:0 4px
}

/* 設問タブ */
.q-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.q-tab{flex:1;min-width:62px;padding:10px 6px;background:var(--paper);border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:.82rem;cursor:pointer;text-align:center;transition:all .15s;color:var(--ink);line-height:1.3}
.q-tab .qt-num{font-size:.7rem;font-weight:500;display:block;margin-top:2px}
.q-tab.active.qt1{background:var(--p1);color:#fff;border-color:var(--p1)}
.q-tab.active.qt2{background:var(--p2);color:#fff;border-color:var(--p2)}
.q-tab.active.qt3{background:var(--p3);color:#5a3a10;border-color:var(--p3)}
.q-tab.active.qt4{background:var(--p4);color:#fff;border-color:var(--p4)}

/* 設問カード */
.qcard{background:var(--paper);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.qcard.qc1{border-top:5px solid var(--p1)}
.qcard.qc2{border-top:5px solid var(--p2)}
.qcard.qc3{border-top:5px solid var(--p3)}
.qcard.qc4{border-top:5px solid var(--p4)}

.topic{padding:6px 12px;border-radius:8px;display:inline-block;font-size:.78rem;font-weight:700;margin-bottom:10px}
.topic.t1{background:var(--p1-bg);color:var(--p1)}
.topic.t2{background:var(--p2-bg);color:var(--p2)}
.topic.t3{background:var(--p3-bg);color:#5a3a10}
.topic.t4{background:var(--p4-bg);color:var(--p4)}

.q-instruction{font-size:.82rem;color:#666;margin-bottom:10px;background:#fffcf3;padding:8px 12px;border-radius:8px;border-left:3px solid var(--accent3);line-height:1.5}
.q-instruction b{color:var(--accent)}

/* 対応段落の再掲 */
.related-para{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-family:"Georgia",serif;font-size:.95rem;line-height:1.85;border:2px solid}
.related-para.p1{background:var(--p1-bg);border-color:var(--p1)}
.related-para.p2{background:var(--p2-bg);border-color:var(--p2)}
.related-para.p3{background:var(--p3-bg);border-color:var(--p3)}
.related-para.p4{background:var(--p4-bg);border-color:var(--p4)}
.related-para .rp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:"Hiragino Maru Gothic ProN",sans-serif;font-size:.78rem;font-weight:800}
.related-para.p1 .rp-head{color:var(--p1)}
.related-para.p2 .rp-head{color:var(--p2)}
.related-para.p3 .rp-head{color:#5a3a10}
.related-para.p4 .rp-head{color:var(--p4)}
.related-para .rp-play{background:#fff;border:1.5px solid currentColor;border-radius:5px;padding:3px 8px;font-size:.72rem;font-weight:700;cursor:pointer;color:inherit;font-family:inherit}
.related-para .rp-play:hover{background:rgba(255,255,255,.8)}

.toggle-ja{margin-bottom:10px;padding:6px 12px;background:var(--paper);border:1.5px solid var(--accent2);color:var(--accent2);border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.para-ja{display:none;background:var(--hint);padding:8px 10px;border-radius:6px;margin-top:8px;font-size:.85rem;line-height:1.65;border-left:3px solid var(--accent2);font-family:"Hiragino Maru Gothic ProN",sans-serif}
.para-ja.show{display:block}

/* キーワードハイライト */
.word{position:relative;border-bottom:2px dotted var(--accent2);cursor:help;color:var(--accent2);font-weight:600}
.word:hover, .word.tapped{background:#fff5d6}
.word-pop{position:absolute;left:50%;top:100%;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:8px 10px;border-radius:8px;font-size:.78rem;font-family:"Hiragino Maru Gothic ProN",sans-serif;font-weight:500;line-height:1.5;white-space:nowrap;z-index:50;display:none;margin-top:6px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.word-pop::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#2b2b2b}
.word-pop.show{display:block}
.word-pop .pop-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.word-pop .accent{color:#ffd166;font-weight:700}
.word-pop button{background:var(--accent3);color:#fff;border:none;border-radius:6px;padding:3px 8px;font-size:.72rem;cursor:pointer;font-family:inherit}
.word-pop button.save{background:var(--good)}
.word-pop button.saved{background:#888}
.word-pop button.speak{background:var(--accent2);font-size:.85rem;padding:3px 9px}
.word-pop .pop-buttons{display:flex;gap:4px;flex-direction:column}

/* 質問・選択肢 */
.qsec{background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.qsec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.qsec-num{display:inline-block;color:#fff;font-weight:800;padding:3px 10px;border-radius:6px;font-size:.78rem}
.qsec-num.s1{background:var(--p1)}
.qsec-num.s2{background:var(--p2)}
.qsec-num.s3{background:var(--p3);color:#5a3a10}
.qsec-num.s4{background:var(--p4)}
.qsec-question{font-family:"Georgia",serif;font-size:.95rem;line-height:1.6;margin-bottom:8px;color:var(--ink)}
.qsec-question .blank-num{display:inline-block;background:#fff5d6;border:1.5px dashed var(--accent3);color:var(--accent3);padding:1px 12px;margin:0 4px;border-radius:4px;font-weight:800;font-size:.85rem;font-family:sans-serif}

.choices{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.choice{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem;cursor:pointer;text-align:left;font-family:"Georgia",serif;color:var(--ink);transition:all .15s;line-height:1.45;font-weight:600}
.choice .num{display:inline-block;background:var(--soft);color:var(--accent2);font-weight:800;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;margin-right:8px;font-size:.78rem;font-family:sans-serif;vertical-align:middle}
.choice.correct{background:#e8f5e9;border-color:var(--good)}
.choice.correct .num{background:var(--good);color:#fff}
.choice.wrong{background:#fde8e8;border-color:var(--accent);opacity:.85}
.choice.wrong .num{background:var(--accent);color:#fff}

.result-msg{margin-top:10px;padding:12px;border-radius:8px;font-weight:700;text-align:center;display:none}
.result-msg.show{display:block}
.result-msg.ok{background:#e8f5e9;color:var(--good)}
.result-msg.ng{background:#fde8e8;color:var(--accent)}

/* モード切替 */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 10px}
.mode-btn{padding:10px 8px;border:2px solid var(--line);background:var(--paper);border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;text-align:center;color:var(--ink);line-height:1.3;font-family:inherit}
.mode-btn.active{background:var(--accent3);color:#fff;border-color:var(--accent3)}

.mode-panel{background:var(--soft);padding:14px;border-radius:10px;margin-top:6px;display:none;border:1px solid var(--line)}
.mode-panel.show{display:block}
.mode-panel h3{font-size:.92rem;color:var(--accent2);margin-bottom:8px;border-left:4px solid var(--accent3);padding-left:8px}

.hint-buttons{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.hint-btn{flex:1;min-width:80px;padding:8px;background:var(--accent3);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;font-family:inherit}
.hint-box{background:var(--paper);padding:10px 12px;border-left:4px solid var(--accent3);border-radius:6px;margin-bottom:6px;font-size:.88rem;line-height:1.6;display:none}
.hint-box.show{display:block;animation:slidein .25s}
.hint-box p{margin-bottom:6px}
.hint-box p:last-child{margin-bottom:0}

.hint-box .word-table{width:100%;border-collapse:collapse;margin:8px 0;background:var(--soft);border-radius:6px;overflow:hidden;font-size:.85rem}
.hint-box .word-table th{background:var(--accent2);color:#fff;padding:5px 8px;text-align:left;font-weight:700;font-size:.78rem}
.hint-box .word-table td{padding:5px 8px;border-bottom:1px solid var(--line)}
.hint-box .word-table tr:last-child td{border-bottom:none}
.hint-box .word-table .en{font-family:"Georgia",serif;font-weight:700;color:var(--accent2);width:40%}
.hint-box .word-table .ja{color:var(--ink)}
.hint-box .step{margin-top:8px;padding:8px 10px;background:#fff5e0;border-radius:6px;border-left:3px solid var(--accent3)}
.hint-box .think-arrow{color:var(--accent);font-weight:800;margin:0 4px}
.hint-box .strategy{margin-top:8px;padding:10px 12px;background:#e8f4ff;border-radius:6px;border-left:3px solid var(--accent2)}
.hint-box .strategy b{color:var(--accent2)}
.hint-box .signal-word{background:#fff5d6;padding:1px 6px;border-radius:4px;font-weight:800;color:var(--accent);font-family:"Georgia",serif}
@keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.hint-num{font-weight:800;color:#fff;background:var(--accent);display:inline-block;padding:2px 10px;border-radius:6px;font-size:.78rem;margin-bottom:6px}

.explain-box{background:var(--paper);padding:14px;border-radius:8px;border-left:4px solid var(--accent3);font-size:.9rem;line-height:1.85}
.explain-box p{margin-bottom:10px}
.explain-box p:last-child{margin-bottom:0}
.explain-box b{color:var(--accent);background:#fff;padding:0 3px;border-radius:3px}
.explain-box .ans-key{display:inline-block;background:#fffcf3;border:1.5px solid var(--good);color:var(--good);padding:3px 10px;border-radius:6px;font-weight:800;margin-bottom:8px;font-size:.92rem}
.explain-box .check-table{width:100%;border-collapse:collapse;margin:10px 0;background:#fafafa;border-radius:6px;overflow:hidden;font-size:.85rem}
.explain-box .check-table th{background:var(--accent2);color:#fff;padding:6px 8px;text-align:left;font-size:.78rem}
.explain-box .check-table td{padding:6px 8px;border-bottom:1px solid var(--line);background:#fff}
.explain-box .check-table tr:last-child td{border-bottom:none}
.explain-box .check-table .ng{color:var(--accent);font-weight:700}
.explain-box .check-table .ok{color:var(--good);font-weight:700}
.explain-box .ja-trans{background:var(--hint);padding:8px 10px;border-radius:6px;margin-top:10px;border-left:3px solid var(--accent2)}
.explain-box .ja-trans b{color:var(--accent2);background:transparent;padding:0}
.explain-box .clue-quote{background:#fff5d6;padding:6px 10px;border-radius:5px;margin:6px 0;border-left:3px solid var(--accent3);font-family:"Georgia",serif;font-size:.88rem}
.explain-box .clue-quote::before{content:"💡 本文の根拠：";display:block;font-family:"Hiragino Maru Gothic ProN",sans-serif;font-size:.75rem;color:#806000;font-weight:800;margin-bottom:3px}

/* 復習リスト */
.review-fab{position:fixed;bottom:14px;right:14px;background:var(--accent);color:#fff;border:none;border-radius:30px;padding:12px 16px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100;font-family:inherit}
.review-fab .count{background:#fff;color:var(--accent);border-radius:50%;padding:1px 7px;margin-left:6px;font-size:.75rem}
.review-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}
.review-modal.show{display:flex}
.review-content{background:var(--paper);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto}
.review-content h2{color:var(--accent);font-size:1.05rem;margin-bottom:10px}
.review-card{background:var(--soft);padding:12px;border-radius:10px;margin-bottom:10px}
.review-word{font-size:1.1rem;font-weight:800;color:var(--accent2);margin-bottom:6px;font-family:"Georgia",serif}
.review-q{font-size:.85rem;margin-bottom:8px;color:#555}
.review-actions{display:flex;gap:6px;margin-top:8px}
.review-actions button{flex:1;padding:8px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:.8rem;color:#fff;font-family:inherit}
.btn-remember{background:var(--good)}
.close-btn{background:#888;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}

/* ヒント注意書き */
.hint-notice{background:#fff8e1;border:1px solid #ffd982;padding:10px 12px;border-radius:8px;font-size:.8rem;color:#806000;margin-bottom:10px;line-height:1.55}
.hint-notice b{color:#a05000}

/* 学習のすすめ */
.study-rec{background:linear-gradient(135deg,#f0f8e8,#dcefcd);border:1px solid #a5c97c;padding:12px 14px;border-radius:10px;font-size:.85rem;color:#3a5a1f;margin-top:14px;line-height:1.7}
.study-rec b{color:#2c4a14}
.study-rec h4{color:#2c4a14;margin-bottom:6px;font-size:.92rem}
.study-rec a{display:inline-block;background:#5a8a2c;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:700;font-size:.82rem;margin:4px 4px 0 0;font-family:inherit}
.study-rec a:hover{background:#3e6a14}

@media (max-width:480px){
  .para-tag{width:50px;font-size:.68rem}
  .para-tag .ptag-num{font-size:.85rem}
  .para-body{font-size:.86rem;padding:8px 10px}
  .qsec-question{font-size:.9rem}
  .choice{font-size:.88rem;padding:9px 10px}
  .related-para{font-size:.9rem;padding:10px 12px}
}
</style>
</head>
<body>

<header>
  <h1>📖 高認英語 第6問 類題演習（長文読解）</h1>
  <p><span class="badge">長文読解</span>段落と設問は対応している！全文読まなくても解ける戦略</p>
</header>

<div class="tip-banner">
  💡 <b>このヒントの使い方</b><br>
  これは<b>「英語が苦手な方が 40点合格を取る」ための戦略的ヒント</b>です。<b>満点用ではありません</b>。確実に得点を伸ばすには、まず<b>中学英単語・中学英文法</b>を学んだうえで、このヒントを補助として使ってください。
</div>

<div class="year-pick" id="yearPick"></div>

<!-- 段落俯瞰ビュー -->
<div class="story-overview" id="storyOverview"></div>

<!-- 設問タブ -->
<div class="q-tabs" id="qTabs"></div>

<!-- 設問本体 -->
<div id="qContainer"></div>

<button class="review-fab" onclick="openReview()">📚 復習リスト<span class="count" id="reviewCount">0</span></button>

<div class="review-modal" id="reviewModal">
  <div class="review-content">
    <h2>📚 復習リスト</h2>
    <div id="reviewBody"></div>
    <button class="close-btn" onclick="closeReview()">閉じる</button>
  </div>
</div>


<script>
const QUESTIONS_DATA = {"Set-A": {"storyTitle": "Mina's First Flute", "topicJa": "吹奏楽部で先輩に助けられて上達する話", "paragraphs": [{"summary": "初心者のミナ、音が出ず悩む", "en": "Mina joined the brass band club in April. She had never played an instrument before, so she felt very nervous. The club teacher gave her a flute and said, \"Don't worry. Everyone starts as a beginner.\" But when Mina tried to play, only a weak, quiet sound came out. Her classmates were already playing songs, and Mina felt left behind. After one week, she began to think about quitting the club.", "ja": "ミナは4月に吹奏楽部に入りました。彼女はこれまで楽器を演奏したことがなかったので、とても緊張していました。部の先生は彼女にフルートを渡して、「心配しないで。みんな初心者から始めるのよ」と言いました。しかしミナが吹いてみると、弱くて小さな音しか出ませんでした。クラスメイトはもう曲を演奏していて、ミナは取り残されたように感じました。1週間後、彼女は部活をやめることを考え始めました。"}, {"summary": "早朝練習で先輩が助ける", "en": "One morning, Mina came to school early to practice by herself in an empty music room. She blew into the flute again and again, but the sound did not get better. Then a third-year student named Ms. Ono came in to get her bag. She listened for a moment and smiled. \"Your fingers are fine,\" she said. \"The problem is how you breathe. Let me show you.\" Ms. Ono showed Mina how to shape her lips and how to take a deep breath from her stomach.", "ja": "ある朝、ミナは誰もいない音楽室で一人で練習するために、早く学校に来ました。彼女は何度もフルートを吹きましたが、音は良くなりませんでした。そのとき、3年生のオノさんがかばんを取りに入ってきました。彼女はしばらく耳を傾けて、にっこりしました。「指は大丈夫よ」と彼女は言いました。「問題は息の吸い方ね。見せてあげる」。オノさんはミナに、唇の形の作り方と、おなかから深く息を吸う方法を見せました。"}, {"summary": "仲間が増え演奏会へ", "en": "After that, Ms. Ono and Mina practiced together before class every day for a month. Other members began to join them. Some brought snacks, and some gave advice about reading music. Little by little, Mina's sound became clear and warm. At the autumn concert, she played a short solo in front of the whole school. Her hands were shaking, but she remembered those quiet mornings and kept going.", "ja": "それから、オノさんとミナは1か月間、毎日授業の前に一緒に練習しました。ほかの部員も加わり始めました。おやつを持ってくる人もいれば、楽譜の読み方について助言をくれる人もいました。少しずつ、ミナの音は澄んで温かくなりました。秋の演奏会で、彼女は全校生徒の前で短いソロを演奏しました。手は震えていましたが、彼女はあの静かな朝を思い出して、演奏を続けました。"}, {"summary": "助けを求める大切さに気づく", "en": "When the song ended, the audience clapped loudly. Her teammates hugged her on the stage. Mina understood something important that day. She had not improved only by her own effort. She had improved because she asked for help and accepted it. Now she is happy to help new members, just as Ms. Ono helped her.", "ja": "曲が終わると、観客は大きな拍手をしました。チームメイトは舞台の上でミナを抱きしめました。ミナはその日、大切なことを理解しました。彼女は自分の努力だけで上達したのではありませんでした。助けを求め、それを受け入れたから上達したのです。今、彼女はオノさんが自分を助けてくれたように、新しい部員を助けることを喜びに思っています。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "When Mina first tried to play the flute,", "qPost": ".", "qPreJa": "ミナが初めてフルートを吹いてみたとき、", "qPostJa": "。", "choices": ["she made a beautiful sound", "she could make only a weak sound", "she played a song with her classmates", "she broke the flute"], "choicesJa": ["美しい音を出した", "弱い音しか出せなかった", "クラスメイトと一緒に曲を演奏した", "フルートを壊した"], "answer": 2, "keyWords": [{"w": "nervous", "mean": "緊張した", "kana": "ナーバス", "ac": "ナー"}, {"w": "instrument", "mean": "楽器", "kana": "インストゥルメント", "ac": "イン"}, {"w": "beginner", "mean": "初心者", "kana": "ビギナー", "ac": "ギ"}, {"w": "weak", "mean": "弱い", "kana": "ウィーク", "ac": "ウィー"}, {"w": "quiet", "mean": "静かな、小さな", "kana": "クワイエット", "ac": "クワイ"}, {"w": "classmates", "mean": "クラスメイト", "kana": "クラスメイツ", "ac": "クラス"}, {"w": "left behind", "mean": "取り残された", "kana": "レフト ビハインド", "ac": "ハイン"}, {"w": "quitting", "mean": "やめること", "kana": "クウィッティング", "ac": "クウィッ"}], "hints": ["<p>設問は「初めて吹いてみたとき」の場面です。<b>第1段落</b>だけを読んで、カギになる語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>tried to play</td><td class='ja'>吹いてみた（演奏しようとした）</td></tr><tr><td class='en'>only</td><td class='ja'>〜だけ、〜しか</td></tr><tr><td class='en'>weak</td><td class='ja'>弱い</td></tr><tr><td class='en'>quiet</td><td class='ja'>静かな、小さな</td></tr><tr><td class='en'>came out</td><td class='ja'>（音が）出てきた</td></tr><tr><td class='en'>classmates</td><td class='ja'>クラスメイト</td></tr><tr><td class='en'>left behind</td><td class='ja'>取り残された</td></tr></table>", "<p>長文読解は<b>「設問の場面を本文で見つける」</b>ところから始めます。</p><div class='strategy'><b>長文読解のコツ：</b><br>① 設問は<b>段落順</b>に並んでいる<span class='think-arrow'>→</span>設問1＝第1段落<br>② 設問の<b>動詞・場面</b>（tried to play）を本文で探す<br>③ <b>主語（誰が）</b>を確認する<span class='think-arrow'>→</span>ミナなのか、クラスメイトなのか</div><div class='step'>設問の <b>first tried to play</b> は、本文の <span class='signal-word'>But when Mina tried to play</span>（ミナが吹いてみたとき）と同じ場面です。<span class='think-arrow'>→</span>この<b>すぐ後ろ</b>に、そのとき起きたことが書かれています。</div><div class='step'>後ろを見ると <span class='signal-word'>only a ... sound came out</span>（〜な音<b>しか</b>出なかった）とあります。<span class='think-arrow'>→</span><b>only</b>（〜しか）と、音を表す<b>形容詞</b>の2語がポイントです。</div>", "<p><b>絞り込みのコツ</b>：まず、音の形容詞（weak, quiet）と<b>反対のイメージ</b>の選択肢は外れます。次に、第1段落で<b>曲を演奏していたのは誰か</b>（Her classmates were already playing songs）を確認しましょう。ミナ本人の話でない選択肢も外れます。さらに、本文に<b>まったく出てこない出来事</b>も消せます。残るのは、<b>本文の「音の様子」を別の言い方に変えた</b>選択肢です。</p>"], "explain": "<p>第1段落から答えを探す問題です。「初めて吹いてみたとき」の音の様子を確認しましょう。</p><div class=\"ans-key\">✅ 正解：② she could make only a weak sound</div><div class=\"clue-quote\">But when Mina tried to play, only a weak, quiet sound came out.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">only a weak, quiet sound came out</span>（弱くて小さな音しか出なかった）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">could make only a weak sound</span>（弱い音しか出せなかった）</b>。本文は「音が出た」と書き、選択肢は「ミナが出せた」と主語を変えて言い換えています。<b>only</b>（〜しか）が共通しているのが決め手です。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 美しい音を出した</td><td>本文は a weak, quiet sound と述べており、美しい音ではない</td><td class=\"ng\">×</td></tr><tr><td>② 弱い音しか出せなかった</td><td>第1段落の only a weak, quiet sound came out と一致</td><td class=\"ok\">○</td></tr><tr><td>③ クラスメイトと一緒に曲を演奏した</td><td>曲を演奏していたのはクラスメイトで、ミナは取り残されたと書かれている</td><td class=\"ng\">×</td></tr><tr><td>④ フルートを壊した</td><td>フルートを壊したという記述は本文のどこにもない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：「only」を見逃さない</b><br><b>only a weak, quiet sound</b> の <b>only</b> は「〜しか〜ない」という限定です。「弱い音しか出せなかった」と言い換えた選択肢が、本文の意味にいちばん近くなります。</p><p><b>判断のポイント2：主語（誰が）を確認する</b><br>③は「曲を演奏した」という内容自体は本文にありますが、演奏していたのは <b>Her classmates</b> です。ミナは <b>left behind</b>（取り残された）と書かれています。人物を入れ替えるひっかけに注意しましょう。</p><p><b>覚えておきたい単語</b>：<b>weak</b>（弱い）、<b>quiet</b>（静かな、小さな）、<b>left behind</b>（取り残された）、<b>beginner</b>（初心者）。</p>"}, {"no": 2, "qNum": 22, "paraIdx": 1, "color": "p2", "qPre": "One morning, Mina came to school early because", "qPost": ".", "qPreJa": "ある朝、ミナが早く学校に来たのは、", "qPostJa": "からです。", "choices": ["she wanted to meet Ms. Ono", "the teacher told her to clean the music room", "she wanted to practice by herself", "she had forgotten her bag"], "choicesJa": ["オノさんに会いたかった", "先生に音楽室の掃除を頼まれた", "一人で練習したかった", "かばんを忘れた"], "answer": 3, "keyWords": [{"w": "empty", "mean": "からっぽの", "kana": "エンプティ", "ac": "エン"}, {"w": "practice", "mean": "練習する", "kana": "プラクティス", "ac": "ラク"}, {"w": "blew", "mean": "吹いた", "kana": "ブルー", "ac": "ブ"}, {"w": "again and again", "mean": "何度も", "kana": "アゲイン アンド アゲイン", "ac": "ゲイ"}, {"w": "breathe", "mean": "息をする", "kana": "ブリーズ", "ac": "ブリー"}, {"w": "stomach", "mean": "おなか", "kana": "スタマック", "ac": "スタ"}, {"w": "shape", "mean": "形づくる", "kana": "シェイプ", "ac": "シェイ"}, {"w": "by herself", "mean": "一人で", "kana": "バイ ハーセルフ", "ac": "ハー"}, {"w": "forgotten", "mean": "忘れた", "kana": "フォーガットゥン", "ac": "ガッ"}], "hints": ["<p>設問は<b>第2段落</b>の最初の文に関係します。まず、カギの語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>came to school early</td><td class='ja'>早く学校に来た</td></tr><tr><td class='en'>to practice</td><td class='ja'>練習するために</td></tr><tr><td class='en'>by herself</td><td class='ja'>一人で</td></tr><tr><td class='en'>empty</td><td class='ja'>からっぽの、誰もいない</td></tr><tr><td class='en'>again and again</td><td class='ja'>何度も</td></tr><tr><td class='en'>named Ms. Ono</td><td class='ja'>オノさんという名前の</td></tr><tr><td class='en'>to get her bag</td><td class='ja'>（オノさんが）かばんを取るために</td></tr></table>", "<p>「〜したのは…だから」と<b>理由</b>を問う設問は、<b>目的や理由を表す表現</b>を探します。</p><div class='strategy'><b>このタイプの読解ルール：</b><br>① 設問の文（came to school early）を<b>そのまま本文で探す</b><br>② 理由・目的のサインを探す<span class='think-arrow'>→</span><b>to＋動詞</b>（〜するために）、because、so など<br>③ <b>誰の行動</b>かを確認する<span class='think-arrow'>→</span>ミナか、オノさんか</div><div class='step'>設問の <b>came to school early</b> は、第2段落の最初の文 <span class='signal-word'>Mina came to school early</span> と同じです。<span class='think-arrow'>→</span>その<b>すぐ後ろ</b>に理由が続きます。</div><div class='step'>後ろに <span class='signal-word'>to + 動詞</span> の形があります。<span class='think-arrow'>→</span><b>to＋動詞</b>は「〜するために」という<b>目的</b>の意味です。何のために来たのかを日本語にしてみましょう。</div>", "<p><b>絞り込みのコツ</b>：<b>Ms. Ono</b> が登場するのは、ミナが練習した<b>あと</b>（Then ...）です。早く来た理由には使えません。<b>bag</b> が出てくる選択肢は、<b>誰のかばん</b>かを本文で確認しましょう。また、先生が何かを<b>頼んだ</b>という記述は本文にありません。残るのは、<b>to のあとに書かれた目的</b>を別の言い方に変えたものです。</p>"], "explain": "<p>第2段落の最初の文から答えを探す問題です。</p><div class=\"ans-key\">✅ 正解：③ she wanted to practice by herself</div><div class=\"clue-quote\">One morning, Mina came to school early to practice by herself in an empty music room.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">to practice by herself</span>（一人で練習するために）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">wanted to practice by herself</span>（一人で練習したかった）</b>。本文では <b>to＋動詞</b>（〜するために）で目的を表し、選択肢では <b>wanted to 〜</b>（〜したかった）と言い換えています。「目的」と「したかったこと」は同じ内容です。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① オノさんに会いたかった</td><td>オノさんはあとから偶然入ってきた人で、ミナが会いに来たわけではない</td><td class=\"ng\">×</td></tr><tr><td>② 先生に掃除を頼まれた</td><td>先生に掃除を頼まれたという記述は本文にない</td><td class=\"ng\">×</td></tr><tr><td>③ 一人で練習したかった</td><td>to practice by herself in an empty music room と一致</td><td class=\"ok\">○</td></tr><tr><td>④ かばんを忘れた</td><td>かばんを取りに来たのはオノさんで、ミナではない</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：to不定詞の「目的」</b><br><b>to practice</b> は「練習するために」という意味です。理由を問う設問では、<b>to＋動詞</b>の形を探すと答えが見つかります。</p><p><b>判断のポイント2：「bag」のひっかけ</b><br>④は本文の <b>bag</b> という語を使ったひっかけです。<b>to get her bag</b> の <b>her</b> はオノさんのことで、ミナではありません。語が同じでも、<b>誰のことか</b>を必ず確認しましょう。</p><p><b>覚えておきたい単語</b>：<b>empty</b>（からっぽの）、<b>by herself</b>（一人で）、<b>again and again</b>（何度も）、<b>shape</b>（形づくる）。</p>"}, {"no": 3, "qNum": 23, "paraIdx": 2, "color": "p3", "qPre": "After Ms. Ono helped Mina,", "qPost": ".", "qPreJa": "オノさんがミナを助けたあと、", "qPostJa": "。", "choices": ["other members started to practice with them", "Mina decided to leave the club", "Ms. Ono moved to another school", "the concert was canceled"], "choicesJa": ["ほかの部員も一緒に練習し始めた", "ミナは部活をやめることにした", "オノさんは別の学校に移った", "演奏会は中止になった"], "answer": 1, "keyWords": [{"w": "join", "mean": "加わる", "kana": "ジョイン", "ac": "ジョ"}, {"w": "members", "mean": "部員", "kana": "メンバーズ", "ac": "メン"}, {"w": "practiced", "mean": "練習した", "kana": "プラクティスト", "ac": "ラク"}, {"w": "advice", "mean": "助言", "kana": "アドヴァイス", "ac": "ヴァイ"}, {"w": "snacks", "mean": "おやつ", "kana": "スナックス", "ac": "スナッ"}, {"w": "concert", "mean": "演奏会", "kana": "コンサート", "ac": "コン"}, {"w": "canceled", "mean": "中止された", "kana": "キャンセルド", "ac": "キャン"}, {"w": "decided", "mean": "決めた", "kana": "ディサイデッド", "ac": "サイ"}], "hints": ["<p>設問は「助けられた<b>あと</b>」の出来事です。<b>第3段落</b>のカギの語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>After that</td><td class='ja'>その後</td></tr><tr><td class='en'>practiced together</td><td class='ja'>一緒に練習した</td></tr><tr><td class='en'>Other members</td><td class='ja'>ほかの部員たち</td></tr><tr><td class='en'>began to join</td><td class='ja'>加わり始めた</td></tr><tr><td class='en'>advice</td><td class='ja'>助言</td></tr><tr><td class='en'>little by little</td><td class='ja'>少しずつ</td></tr><tr><td class='en'>autumn concert</td><td class='ja'>秋の演奏会</td></tr></table>", "<p>「〜のあと」を問う設問は、<b>出来事の順序</b>がカギになります。</p><div class='strategy'><b>このタイプの読解ルール：</b><br>① <b>After</b> や <b>Then</b> などの<b>時間のサイン</b>に注目<br>② 設問の「あと」が<b>本文のどこから</b>始まるかを決める<br>③ 助けられる<b>前</b>の話と<b>後</b>の話を混ぜない</div><div class='step'>第2段落の最後で、オノさんがミナに息の吸い方を教えました。その次の第3段落は <span class='signal-word'>After that</span>（その後）で始まります。<span class='think-arrow'>→</span>設問の「助けたあと」は、ここからの話です。</div><div class='step'>2文目は <span class='signal-word'>Other members</span> で始まります。<span class='think-arrow'>→</span>ミナやオノさんではなく、<b>周りの人たち</b>に何が起きたかを読み取りましょう。<b>join</b> は「加わる」です。</div>", "<p><b>絞り込みのコツ</b>：ミナが<b>やめようと考えた</b>のは、第1段落の話で、助けられる<b>前</b>です。順序が合いません。オノさんが<b>転校した</b>という記述は本文にありません。<b>演奏会</b>は、第3段落で実際に開かれてミナがソロを演奏しています。残るのは、<b>「その後」の第3段落に書かれた周りの人たちの動き</b>に合う選択肢です。</p>"], "explain": "<p>第3段落から答えを探す問題です。「助けられたあと」に何が起きたかを確認しましょう。</p><div class=\"ans-key\">✅ 正解：① other members started to practice with them</div><div class=\"clue-quote\">After that, Ms. Ono and Mina practiced together before class every day for a month. Other members began to join them.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">Other members began to join them</span>（ほかの部員が彼女たちに加わり始めた）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">other members started to practice with them</span>（ほかの部員が一緒に練習し始めた）</b>。<b>began</b> は <b>started</b> に、<b>join them</b>（彼女たちに加わる）は <b>practice with them</b>（一緒に練習する）に言い換えられています。直前の文で2人が一緒に練習していたので、「加わる」は「一緒に練習する」ことだと分かります。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① ほかの部員も一緒に練習し始めた</td><td>Other members began to join them と一致</td><td class=\"ok\">○</td></tr><tr><td>② ミナは部活をやめることにした</td><td>やめようと考えたのは第1段落の、助けられる前の話</td><td class=\"ng\">×</td></tr><tr><td>③ オノさんは別の学校に移った</td><td>オノさんが別の学校に移ったという記述は本文にない</td><td class=\"ng\">×</td></tr><tr><td>④ 演奏会は中止になった</td><td>演奏会は中止されず、ミナがソロを演奏した</td><td class=\"ng\">×</td></tr></table><p><b>判断のポイント1：「After that」で順序をつかむ</b><br><b>After that</b>（その後）で始まる段落は、直前の出来事の<b>続き</b>です。設問の「オノさんが助けたあと」と、第3段落の内容が重なります。</p><p><b>判断のポイント2：前の話を後の話と混ぜない</b><br>②の「やめようと考えた」は事実ですが、<b>第1段落</b>の話で、助けられる前です。本文の内容でも、<b>いつの話か</b>が違うと誤りになります。「助けられた前か後か」を本文で確かめましょう。</p><p><b>覚えておきたい単語</b>：<b>join</b>（加わる）、<b>members</b>（部員）、<b>practice</b>（練習する）、<b>canceled</b>（中止された）。</p>"}, {"no": 4, "qNum": 24, "paraIdx": 3, "color": "p4", "qPre": "Through this experience, Mina learned that", "qPost": ".", "qPreJa": "この経験を通して、ミナは", "qPostJa": "ということを学びました。", "choices": ["practicing alone is always the best way", "only third-year students can teach well", "a flute is easier than other instruments", "asking for help can make you better"], "choicesJa": ["一人で練習するのがいつも一番よい方法だ", "3年生だけがうまく教えられる", "フルートはほかの楽器より簡単だ", "助けを求めることで上達できる"], "answer": 4, "keyWords": [{"w": "audience", "mean": "観客", "kana": "オーディエンス", "ac": "オー"}, {"w": "hugged", "mean": "抱きしめた", "kana": "ハグド", "ac": "ハグ"}, {"w": "understood", "mean": "理解した", "kana": "アンダースタッド", "ac": "ダー"}, {"w": "effort", "mean": "努力", "kana": "エフォート", "ac": "エフォ"}, {"w": "improved", "mean": "上達した", "kana": "インプルーヴド", "ac": "ルー"}, {"w": "asked for help", "mean": "助けを求めた", "kana": "アスクト フォー ヘルプ", "ac": "ヘル"}, {"w": "accepted", "mean": "受け入れた", "kana": "アクセプティド", "ac": "セプ"}, {"w": "alone", "mean": "一人で", "kana": "アローン", "ac": "ロー"}, {"w": "easier", "mean": "より簡単な", "kana": "イージアー", "ac": "イージ"}], "hints": ["<p>設問は「学んだこと」です。<b>最後の第4段落</b>のカギの語句を確認しましょう。</p><table class='word-table'><tr><th>英語</th><th>意味</th></tr><tr><td class='en'>understood</td><td class='ja'>理解した</td></tr><tr><td class='en'>something important</td><td class='ja'>大切なこと</td></tr><tr><td class='en'>not ... only</td><td class='ja'>〜だけではない</td></tr><tr><td class='en'>own effort</td><td class='ja'>自分自身の努力</td></tr><tr><td class='en'>asked for help</td><td class='ja'>助けを求めた</td></tr><tr><td class='en'>accepted</td><td class='ja'>受け入れた</td></tr><tr><td class='en'>because</td><td class='ja'>〜だから（理由）</td></tr></table>", "<p>「学んだこと」「気づいたこと」は<b>最終段落</b>に書かれることが多いです。</p><div class='strategy'><b>長文読解の黄金ルール：</b><br>① 教訓は<b>最終段落</b>の <b>understood / learned / realized</b> のあとにある<br>② <b>because</b> のあとには<b>理由</b>が書かれている<br>③ <b>not only 〜</b>（〜だけではない）は、<b>本当の答えは別にある</b>というサイン</div><div class='step'><span class='signal-word'>Mina understood something important that day.</span> は「大切なことを理解した」という<b>予告</b>の文です。<span class='think-arrow'>→</span>中身は<b>次の2文</b>に書かれています。</div><div class='step'><span class='signal-word'>She had not improved only by her own effort.</span>（自分の努力だけで上達したのではない）<span class='think-arrow'>→</span>では本当の理由は何でしょうか。次の文の <b>because</b> のあとを読みましょう。</div>", "<p><b>絞り込みのコツ</b>：直前で「自分の努力<b>だけ</b>ではない」と言っているので、<b>「一人で」「いつも」</b>を強調する選択肢は本文と反対です。<b>「3年生だけ」</b>や<b>「ほかの楽器との比べ合い」</b>は、本文のどこにも出てきません。残るのは、<b>because のあとの理由</b>（help に関すること）と、上達につながる話を言い換えたものです。</p>"], "explain": "<p>第4段落から答えを探す問題です。ミナが「何を学んだか」を確認しましょう。</p><div class=\"ans-key\">✅ 正解：④ asking for help can make you better</div><div class=\"clue-quote\">She had not improved only by her own effort. She had improved because she asked for help and accepted it.</div><p><b>本文の <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">improved because she asked for help and accepted it</span>（助けを求め、それを受け入れたから上達した）= <span style=\"background:#fff5d6;padding:1px 5px;border-radius:3px;color:#d94f4f;font-weight:700;font-family:Georgia,serif\">asking for help can make you better</span>（助けを求めることで上達できる）</b>。本文は「ミナの過去の経験」として書かれ、選択肢は「一般的な教訓」の形に言い換えています。<b>improved</b>（上達した）は <b>make you better</b>（あなたをよりよくする）に、<b>asked for help</b> は <b>asking for help</b> に置き換わっています。</p><p><b>各選択肢のチェック：</b></p><table class=\"check-table\"><tr><th>選択肢</th><th>本文との照合</th><th>判定</th></tr><tr><td>① 一人で練習するのがいつも一番よい方法だ</td><td>本文は自分の努力だけで上達したのではないと述べており、正反対</td><td class=\"ng\">×</td></tr><tr><td>② 3年生だけがうまく教えられる</td><td>3年生だけが教えられるとは書かれていない</td><td class=\"ng\">×</td></tr><tr><td>③ フルートはほかの楽器より簡単だ</td><td>フルートとほかの楽器の難しさを比べる記述はない</td><td class=\"ng\">×</td></tr><tr><td>④ 助けを求めることで上達できる</td><td>she asked for help and accepted it と一致</td><td class=\"ok\">○</td></tr></table><p><b>判断のポイント1：「understood」のあとに教訓がある</b><br>最終段落の <b>understood</b> や <b>learned</b> のあとに答えがあることが多いです。この問題でも、次の2文が教訓の中身でした。</p><p><b>判断のポイント2：「not only」と「because」</b><br><b>not ... only by her own effort</b> で「努力だけではない」と否定し、<b>because</b> で本当の理由を示しています。①の <b>alone</b>（一人で）や <b>always</b>（いつも）は、この流れと<b>正反対</b>です。</p><p><b>覚えておきたい単語</b>：<b>effort</b>（努力）、<b>improve</b>（上達する）、<b>ask for help</b>（助けを求める）、<b>accept</b>（受け入れる）。</p>"}]}, "Set-B": {"storyTitle": "Rice, Beans, and Okonomiyaki", "topicJa": "留学生との交流：言葉が通じなくても料理を通して仲良くなる話", "paragraphs": [{"summary": "最初の夜、言葉が通じず気まずい", "en": "Sota's family decided to host an exchange student from Brazil for three months. His name was Lucas, and he was sixteen years old. Sota had cleaned his room carefully and even put a small flag of Brazil on the desk. He was excited, but he was also worried. His English was not good, and Lucas spoke only a little Japanese. On the first night, they sat at the dinner table and said very little. The silence made Sota feel uncomfortable.", "ja": "ソウタの家族は、ブラジルからの交換留学生を3か月間受け入れることにしました。名前はルーカスで、16歳でした。ソウタは部屋を丁寧に掃除し、机の上に小さなブラジルの旗まで置きました。彼はわくわくしていましたが、心配でもありました。彼の英語は上手ではなく、ルーカスも日本語を少ししか話せなかったからです。最初の夜、二人は夕食の席に座りましたが、ほとんど話しませんでした。その沈黙のせいで、ソウタは気まずく感じました。"}, {"summary": "写真で通じ合い料理の約束", "en": "The next evening, Sota's mother made curry. Lucas smiled and said, \"In Brazil, we eat rice and beans almost every day.\" Sota did not know the word \"beans,\" so he used his phone to show a picture. Lucas laughed and nodded. Then Sota had an idea. \"Let's cook together on Sunday,\" he said slowly. Lucas answered, \"Yes! I will make my favorite dish.\"", "ja": "次の晩、ソウタの母がカレーを作りました。ルーカスは笑顔で「ブラジルでは、ほとんど毎日ごはんと豆を食べるよ」と言いました。ソウタは「beans」という単語を知らなかったので、携帯電話で写真を見せました。ルーカスは笑ってうなずきました。そこでソウタはあるアイデアを思いつきました。「日曜日に一緒に料理しようよ」と、彼はゆっくり言いました。ルーカスは「うん！ぼくの大好きな料理を作るよ」と答えました。"}, {"summary": "二人で料理し家族も大満足", "en": "On Sunday, the two boys stood in the kitchen. Lucas made a Brazilian dish with rice and beans, and Sota made okonomiyaki, a Japanese pancake. They used pictures, gestures, and simple words. When Sota cut the onions, Lucas showed him a faster way. When the pancake burned a little, both of them laughed again. Sota's parents and sister ate everything and asked for more. The house was full of happy voices.", "ja": "日曜日、二人の少年は台所に立ちました。ルーカスはごはんと豆のブラジル料理を作り、ソウタは日本のパンケーキであるお好み焼きを作りました。二人は写真や身ぶり、簡単な言葉を使いました。ソウタが玉ねぎを切ると、ルーカスはもっと速い方法を見せてくれました。パンケーキが少し焦げたときは、二人でまた笑いました。ソウタの両親と妹はすべて食べて、おかわりを求めました。家は楽しい声でいっぱいでした。"}, {"summary": "通じ合う気持ちの大切さ", "en": "After that day, the boys talked every day. Sota stopped being afraid of making mistakes in English, and Lucas began to use new Japanese words. When Lucas went home, Sota gave him a small gift, and Lucas hugged the whole family at the airport. Sota realized that you can connect with people even if you do not speak the same language perfectly. What matters most is the wish to understand each other.", "ja": "その日以来、二人は毎日話すようになりました。ソウタは英語で間違えることを怖がらなくなり、ルーカスは新しい日本語の言葉を使い始めました。ルーカスが帰国するとき、ソウタは小さな贈り物をあげ、ルーカスは空港で家族全員を抱きしめました。ソウタは、同じ言葉を完全には話せなくても人とつながれるのだと気づきました。いちばん大切なのは、おたがいを理解したいという気持ちです。"}], "questions": [{"no": 1, "qNum": 21, "paraIdx": 0, "color": "p1", "qPre": "On the first night, Sota felt uncomfortable because", "qPost": "", "qPreJa": "最初の夜、ソウタが気まずく感じたのは、", "qPostJa": "", "choices": ["Lucas did not like Japanese food.", "Lucas could speak Japanese very well.", "Sota was angry that Lucas came.", "they hardly talked at the dinner table."], "choicesJa": ["ルーカスが日本食を好きではなかったから", "ルーカスが日本語をとても上手に話せたから"
